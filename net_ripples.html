<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C test: network, broadcast ripples</title>
<style>
  body { margin: 0; background: #10100E; color: #9a9a9a; font: 15px/1.5 system-ui, sans-serif; }
  .note { min-height: 60vh; display: flex; align-items: flex-end; justify-content: center; padding: 0 16px 40px; text-align: center; }
  .after { height: 60vh; }
</style>
</head>
<body>
<div class="note">Test page for the 3D C. Scroll down: it becomes the line, then the grid wall as a network (broadcast ripples), then pulls back to show the wider wall. Scroll back up for the C.</div>
<!--
  The 3D C for Webflow, played from c_web.bin (made by export_c_web.py in Houdini) with three.js.
  The 3D C for Webflow, played from c_web.bin (made by export_c_web.py in Houdini) with three.js.
  This version keeps the grid wall's network dimly lit, and now and then a block sends out a pulse that ripples through
  it link by link (a diamond-shaped ring), brightening tubes and connectors as it passes; several can overlap.
  In Webflow: add a Code Embed where the C goes and paste all of this into it.

  What it does: the C turns on its own forever, its tubes lighting up and going out in the sweep. Scrolling down
  through the section bends it into the line and then spreads it into the grid wall, where the light runs across the
  whole wall from left to right in waves; scrolling further pulls the camera back to show the wall carrying on with
  more blocks (one network). Scrolling back up reverses it all, back to the turning C. The C stays pinned on screen
  while you scroll through the section (its height sets how long the scroll is: 400vh below).

  Light on purpose: nothing loads until the section is about to scroll into view; three.js comes from a CDN only then;
  all the squares (the C's 60 and the wider wall's) are drawn in 3 draw calls (4 with the connectors); it only draws while on screen;
  the pixel ratio is capped at 2; works on WebGL, so every current browser shows it. Visitors who ask for reduced
  motion get a still C (scrolling still works). Put the URL of c_web.bin in data-src below.
-->
<div class="c3d-track" style="position:relative;height:400vh">
  <div class="c3d" data-src="c_web.bin" data-poster=""
       style="position:sticky;top:0;width:100%;height:100vh;overflow:hidden"></div>
</div>

<script type="module">
const CFG = {
  three: "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  // the look, from your Arnold renders: shading spheres ("matcaps") rendered in Maya through your ACES view, next to
  // c_web.bin. c_tube.png holds the glass at `levels` steps from off to fully lit
  look: { block: "c_block.webp", tube: "c_tube.webp", levels: 8 },
  glow: 1.0,                 // a fully lit tube: 1 = the yellow of the Arnold render (lower is dimmer AND greener: ACES)
  brightness: 1.0,           // a lit tube's brightness, keeping its yellow (1 = as bright as the Arnold render)
  // the blocks' noise (like the noise in the C material, stuck to each block as it moves; each block its own):
  // amount = contrast of the noise, lift = how much it brightens the darkest faces, scale = noise cells per unit
  grain: { amount: 0.25, lift: 0.002, scale: 72 },
  // the glass when it's off: how see-through it is facing you (Arnold's transmission 0.75), and how quickly it turns
  // into reflection toward its edges (higher = thinner reflective rim)
  glass: { clear: 0.75, edge: 3.0 },
  // each square shading the one below it: how dark right next to the square above, how far that reaches from its edge,
  // and how fast it fades as the gap between them grows (both as shares of the square's half size)
  shadow: { strength: 0.9, reach: 0.6, depth: 1.5 },
  // a lit tube's light on the face of its own square (Arnold's emission lighting the block): colour at the edge, and
  // how far in it reaches (as a share of the square's half size)
  spill: { color: [0.12, 0.19, 0.0], reach: 0.07, amount: 0.2 },   // amount: 1 = as in the Arnold render
  background: null,          // null = see-through (the section shows behind; your render's background is #10100E)
  // one fixed top orthographic camera, framed like the Maya camera "top": its centre (x, z) and ortho width.
  // null = fit the squares themselves
  camera: { x: 2.4152, z: -0.8530, width: 22.2597 },
  zoom: 1.0,                 // > 1 fills more of the screen
  ends: 0.8,                 // the line and the grid: how much of their width the screen shows at most (< 1 hides their ends)
                             // (their full height always wins: the rows are never cut)
  fade: 6,                   // on screens too wide to hide the ends, they fade out over this % of the screen width (0 = off)
  // how the wall is lit: `mode: "ripples"`: the whole network rests dimly lit (`rest`: its light level, 0..1;
  // `restBrightness`: how bright, 1 = full), and 4 sources each send a pulse from a random block on screen about every
  // `every` seconds; it ripples out link by link at `speed` blocks per second, a ring `width` blocks wide, fading over
  // about `life` seconds. (the `wave` settings below aren't used in this version)
  net: { mode: "ripples", rest: 0.12, restBrightness: 0.45, every: 3.5, speed: 5, width: 0.9, life: 2.5 },
  lines: null,
  // the connectors between neighbouring blocks on the grid wall (across each gap, tube to tube), lit by the same waves
  // and exactly with the tubes (fading up, staying lit and going out with them, flickering with them), so the wall reads
  // as one network. `width`: how thick (1 = as thick as the tubes), shaded like a tube, with a soft `halo` (strength)
  // `haloWidth` CSS pixels wide; `strength`: how bright (1 = the tubes' yellow); `flicker`: how much they dip while lit
  // (0 = steady), `flickerSpeed`: how lively; `fadeIn`: over how much of the scroll animation (after the grid has
  // formed) they fade in as you scroll, and out as you scroll back; `pulse`: how much the band riding the wave
  // (wave.band, below) brightens them (and the tubes) and widens their halo as it passes (0 = not at all). null = none
  connect: { width: 1.0, halo: 0.3, haloWidth: 4, strength: 1.0, flicker: 0.45, flickerSpeed: 1.0, fadeIn: 0.08, pulse: 1.0 },
  // the tubes on the grid wall: how much they flicker while lit (0 = steady), and how lively. The tubes and the
  // connectors flicker as one network (the same flicker across the wall), so keep these the same as connect's
  tubes: { flicker: 0.45, flickerSpeed: 1.0 },
  maxPixelRatio: 2,
  // the sweep (as in Maya, in frames of its 288-frame loop at 24 fps): one tube after another from the C's top tip,
  // each fading up over `ramp` frames, all held, then one after another fading out the same way. This is the C's (and
  // the line's) sweep, as on the other pages
  sweep: { loop: 288, inStart: 20, inStep: 1.8, outStart: 210, outStep: 1.0, ramp: 16, reverse: false },
  // the light on the grid wall (it takes over from `sweep` as the grid forms, and hands back as it breaks up): a wave
  // runs across the screen from left to right lighting everything up (every row at once, smoothly across each block
  // too), everything stays lit for `holdOn` seconds, a second wave runs across turning it all off, everything stays off
  // for `holdOff` seconds, and again. In seconds: `cross`: how long a wave takes to cross the screen (on any screen,
  // pulled back or not); `ramp`: how long each spot takes to fade up (and to go out). The wave's front isn't a straight
  // line marching at one pace: `tilt`: how far ahead the top of the screen is of the bottom; `curve`: how far its front
  // bows and sways, its shape slowly changing from one wave to the next; `surge`: how much its pace swells and eases as
  // it crosses (0 = steady, 0.3 = 30% faster / slower). `mirrorOut`: the tubes go out as quickly as they appear to light
  // up (false = a plain, softer fade); `reverse`: right to left instead.
  // `band`: the band of light riding the wave's front (it carries the grid on the blocks / brightens the connectors), as
  // things light up and again (at `off` strength, 0 = not at all) as they go out: its front sweeps in, it fades up to
  // full over `rise`, back down over the rest of its `length` (both as shares of the screen's width: how wide the wave
  // reads), and its tail sweeps out; `dim`: how bright at its front and tail (1 = no fade); `edge`: how soft its front
  // and tail are (share of the screen's width)
  wave: { cross: 3.2, ramp: 2.2, holdOn: 1.5, holdOff: 1.5, tilt: 1.2, curve: 0.4, surge: 0.3, mirrorOut: true, reverse: false,
          band: { length: 0.38, rise: 0.14, dim: 0.15, edge: 0.11, off: 0 } },
  // the scroll, as shares of the section: the C keeps turning for `hold`, then eases into the line over `blend`; the
  // section then plays the line and the grid wall; then over `zoom` the camera pulls back to show the wall carrying on
  // with more blocks (`zoomOut.amount`), and that stays on screen for the last `end` before the section scrolls away.
  // `smooth`: seconds it takes to catch up with the scroll
  scroll: { hold: 0.035, blend: 0.07, zoom: 0.3, end: 0.1, smooth: 0.15 },
  // the pull back: `amount`: how much more the camera shows at the end (2 = twice as wide and twice as tall). The
  // extra blocks grow out from the wall as it pulls back, keeping pace with the edges of the screen. 1 = no pull back
  zoomOut: { amount: 2.2 },
};

document.querySelectorAll(".c3d[data-src]").forEach((box) => {
  const poster = box.dataset.poster;
  if (poster) {
    const img = new Image();
    img.src = poster; img.alt = ""; img.decoding = "async"; img.className = "c3d-poster";
    img.style.cssText = "position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .4s";
    box.appendChild(img);
  }
  const io = new IntersectionObserver((es) => {
    if (es.some((e) => e.isIntersecting)) { io.disconnect(); start(box).catch((e) => console.warn("[c3d]", e)); }
  }, { rootMargin: "300px" });
  io.observe(box);
});

// ------------------------------------------------------------------ the file
function parse(buf) {
  const dv = new DataView(buf);
  let o = 0;
  const pad = () => { o = (o + 3) & ~3; };
  const u32 = () => { const v = dv.getUint32(o, true); o += 4; return v; };
  const f32s = (k) => { const a = []; for (let i = 0; i < k; i++) { a.push(dv.getFloat32(o, true)); o += 4; } return a; };
  const arr = (T, k) => { const a = new T(buf.slice(o, o + k * T.BYTES_PER_ELEMENT)); o += k * T.BYTES_PER_ELEMENT; pad(); return a; };
  if (String.fromCharCode(...new Uint8Array(buf, 0, 4)) !== "CWEB") throw new Error("not a c_web.bin file");
  o = 4;
  const version = u32();
  if (version !== 4) throw new Error("c_web.bin version " + version + "; re-export with the latest export_c_web.py");
  const n = dv.getUint16(o, true), nParts = dv.getUint16(o + 2, true); o += 4;
  const nClips = u32(), fps = f32s(1)[0];
  const gq = f32s(6), sym = f32s(4);
  const cams = [];
  for (let k = 0; k < 2; k++) { const has = u32(), v = f32s(5); cams.push(has ? { x: v[0], y: v[1], z: v[2], hw: v[3], hh: v[4] } : null); }
  const parts = [];
  for (let p = 0; p < nParts; p++) {
    const mat = u32(), nv = u32(), ni = u32();
    const qp = arr(Uint16Array, nv * 3), qn = arr(Int8Array, nv * 4), idx = arr(Uint16Array, ni);
    const pos = new Float32Array(nv * 3), nor = new Float32Array(nv * 3);
    for (let v = 0; v < nv; v++) for (let a = 0; a < 3; a++) {
      pos[v * 3 + a] = gq[a] + qp[v * 3 + a] * gq[3 + a];
      nor[v * 3 + a] = qn[v * 4 + a] / 127;
    }
    parts.push({ mat, pos, nor, idx });
  }
  const clips = [];
  for (let c = 0; c < nClips; c++) {
    const nf = u32(), q = f32s(10);              // translation min (3), step (3), slope ranges (3 + 1)
    const tracks = [];
    for (let i = 0; i < n; i++) {
      const nt = u32(), nr = u32(), nc = u32();
      const tf = arr(Uint16Array, nt), tv = arr(Uint16Array, nt * 3), td = arr(Int16Array, nt * 3);
      const rf = arr(Uint16Array, nr), rv = arr(Int16Array, nr * 4), rd = arr(Int16Array, nr * 4);
      const cs = arr(Uint16Array, nc);
      const T = new Float32Array(nt * 3), TD = new Float32Array(nt * 3), R = new Float32Array(nr * 4), RD = new Float32Array(nr * 4);
      for (let k = 0; k < nt * 3; k++) { const a = k % 3; T[k] = q[a] + tv[k] * q[3 + a]; TD[k] = td[k] / 32767 * q[6 + a]; }
      for (let k = 0; k < nr * 4; k++) { R[k] = rv[k] / 32767; RD[k] = rd[k] / 32767 * q[9]; }
      const cut = new Uint8Array(nf);
      for (const f of cs) cut[f] = 1;
      tracks.push({ tf, T, TD, rf, R, RD, cut, ct: 0, cr: 0 });
    }
    clips.push({ nf, tracks });
  }
  return { n, fps, sym, cams, parts, loop: clips[0], scroll: clips[1] };
}

// a track's curve at frame f (Hermite: each key has its value and slope); across a cut it holds, then jumps
function hermite(frames, V, D, dim, f, cur, cut, out) {
  let j = cur;
  if (f < frames[j] || j > frames.length - 2) j = 0;
  while (j < frames.length - 2 && frames[j + 1] <= f) j++;
  const f0 = frames[j], h = frames[j + 1] - f0, i0 = j * dim, i1 = i0 + dim;
  if (cut[f0] && h === 1) { for (let k = 0; k < dim; k++) out[k] = V[i0 + k]; return j; }
  const u = (f - f0) / h, u2 = u * u, u3 = u2 * u;
  const a = 2 * u3 - 3 * u2 + 1, b = (u3 - 2 * u2 + u) * h, c = -2 * u3 + 3 * u2, d = (u3 - u2) * h;
  for (let k = 0; k < dim; k++) out[k] = a * V[i0 + k] + b * D[i0 + k] + c * V[i1 + k] + d * D[i1 + k];
  return j;
}
const smoothstep = (x) => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };

// ------------------------------------------------------------------ the scene
async function start(box) {
  const [THREE, data] = await Promise.all([
    import(CFG.three),
    fetch(box.dataset.src).then((r) => { if (!r.ok) throw new Error("c_web.bin: HTTP " + r.status); return r.arrayBuffer(); }),
  ]);
  const C = parse(data);
  const track = box.closest(".c3d-track") || box;

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: CFG.background === null, powerPreference: "high-performance" });
  } catch (e) { console.warn("[c3d] no WebGL, keeping the poster"); return; }
  if (CFG.background !== null) renderer.setClearColor(CFG.background, 1);
  const canvas = renderer.domElement;
  canvas.style.cssText = "position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .4s";
  box.appendChild(canvas);

  const scene = new THREE.Scene();
  const base = new URL(box.dataset.src, location.href);
  const loader = new THREE.TextureLoader();
  const tex = (name) => new Promise((ok, no) => loader.load(new URL(name, base).href, (t) => {
    t.colorSpace = THREE.SRGBColorSpace; t.generateMipmaps = false; t.minFilter = THREE.LinearFilter; ok(t);
  }, undefined, no));
  const [blockTex, tubeTex] = await Promise.all([tex(CFG.look.block), tex(CFG.look.tube)]);

  // the square's own frame (from the block's geometry): its thickness axis, two in-plane edge directions, half size
  const blk = C.parts.find((p) => p.mat === 0) || C.parts[0];
  const nAx = new THREE.Vector3(C.sym[0], C.sym[1], C.sym[2]).normalize();
  let uAx = null, best = 0;
  for (let k = 0; k < blk.nor.length; k += 3) {
    const v = new THREE.Vector3(blk.nor[k], blk.nor[k + 1], blk.nor[k + 2]);
    if (Math.abs(v.dot(nAx)) > 0.1) continue;
    v.addScaledVector(nAx, -v.dot(nAx)).normalize();
    let votes = 0;
    for (let j = 0; j < blk.nor.length; j += 3) {
      const w = new THREE.Vector3(blk.nor[j], blk.nor[j + 1], blk.nor[j + 2]);
      if (Math.abs(w.dot(nAx)) < 0.1 && Math.abs(Math.abs(w.dot(v)) - 1) < 0.02) votes++;
    }
    if (votes > best) { best = votes; uAx = v; }
  }
  if (!uAx) uAx = new THREE.Vector3(1, 0, 0).cross(nAx).normalize();
  const vAx = new THREE.Vector3().crossVectors(nAx, uAx).normalize();
  let half = 0, thick = 0;
  for (let k = 0; k < blk.pos.length; k += 3) {
    const p = new THREE.Vector3(blk.pos[k], blk.pos[k + 1], blk.pos[k + 2]);
    half = Math.max(half, Math.abs(p.dot(uAx)), Math.abs(p.dot(vAx)));
    thick = Math.max(thick, Math.abs(p.dot(nAx)));
  }
  // the tube's corner rounding (from its own shape), so the glow and the shading round the corners the same way
  let rTube = 0.1 * half;
  const tub = C.parts.find((p) => p.mat === 1);
  if (tub) {
    let ax = 0, dg = 0;
    for (let k = 0; k < tub.pos.length; k += 3) {
      const p = new THREE.Vector3(tub.pos[k], tub.pos[k + 1], tub.pos[k + 2]), a = Math.abs(p.dot(uAx)), b = Math.abs(p.dot(vAx));
      ax = Math.max(ax, a, b); dg = Math.max(dg, (a + b) / Math.SQRT2);
    }
    rTube = Math.min(Math.max((ax * Math.SQRT2 - dg) / (Math.SQRT2 - 1), 0), half);
  }
  const rGlow = Math.max(rTube, 3 * CFG.spill.reach * half), rShade = Math.max(rTube, 0.5 * CFG.shadow.reach * half);

  // the wall's waves, worked out per pixel from where it is across the wall (shared by the blocks, the tubes and the
  // connectors). uWave: time (s), seconds per block, seconds between waves, where the waves start (x); uWave2: ramp,
  // lit, mirrorOut, block spacing (negative: right to left); uWave3: the handover from the C's sweep (0..1), forced
  // light (< 0: none), flicker amount, flicker time
  // (uWave: time, crossing time, cycle length; uWave2: ramp, how long a spot stays lit, mirrorOut, block spacing;
  // uWave4: tilt, curve, surge, reverse; uWave5: the screen (camera centre x, z, half width, half height))
  const WAVE = { uWave: { value: new THREE.Vector4() }, uWave2: { value: new THREE.Vector4() }, uWave3: { value: new THREE.Vector4(0, -1, 0, 0) },
    uWave4: { value: new THREE.Vector4() }, uWave5: { value: new THREE.Vector4(0, 0, 1, 1) }, uBand: { value: new THREE.Vector4() }, uBand2: { value: new THREE.Vector4() },
    // the other ways of lighting the wall (CFG.net): the grid's origin, spacing and the tube's middle (uNet), the mode's
    // timing (uNetA, uNetB), the wider wall's cells (uFld2), the signal's arrival times (uNetTex) and the ripples' sources
    uNet: { value: new THREE.Vector4(0, 0, 1, 1) }, uNetA: { value: new THREE.Vector4() }, uNetB: { value: new THREE.Vector4() }, uNetC: { value: new THREE.Vector4() },
    uFld2: { value: new THREE.Vector4(0, 0, 1, 1) }, uNetTex: { value: null },
    uSrc: { value: [0, 1, 2, 3].map(() => new THREE.Vector4()) }, uCurTex: { value: null }, uCurO: { value: new THREE.Vector4(0, 0, 1, 1) } };
  const NETM = { sweep: 0, spread: 1, ripples: 2, traffic: 3, heartbeat: 4, cursor: 5 }[(CFG.net && CFG.net.mode) || "sweep"] || 0;
  const WAVE_GLSL = [
    "#define NET_MODE " + NETM,
    "uniform vec4 uWave, uWave2, uWave3, uWave4, uWave5, uBand, uBand2;",
    // seconds since the lighting wave last reached this spot (0 .. the cycle): u across the screen, v down it. Its pace
    // swells and eases on the way across (surge), the top arrives first (tilt), and the front bows and sways (curve),
    // drifting slowly so no two waves are quite alike (slowly enough that time at every spot only ever runs forward)
    "float wd( float x, float z ) {",
    "  float u = clamp( ( x - uWave5.x ) / ( 2.0 * uWave5.z ) + 0.5, 0.0, 1.0 ), v = clamp( ( z - uWave5.y ) / ( 2.0 * uWave5.w ) + 0.5, 0.0, 1.0 );",
    "  if ( uWave4.w > 0.5 ) u = 1.0 - u;",
    "  float t = uWave.x, k = 9.0 * u, r = 5.0 * v;",
    "  float at = uWave.y * ( u + uWave4.z / 12.566 * sin( 12.566 * u ) * ( 0.75 + 0.25 * sin( 0.23 * t ) ) ) + uWave4.x * v",
    "    + uWave4.y * ( 1.0 + 0.65 * sin( 0.55 * r + 0.17 * t + 0.8 * sin( 0.31 * k ) ) + 0.35 * sin( 1.3 * r - 0.11 * t + 2.0 ) );",
    "  return mod( t - at, uWave.z );",
    "}",
    // a tube's light d seconds after the wave reached it: fades up over ramp, stays lit, goes out over ramp
    "float wlev( float d ) {",
    "  float up = smoothstep( 0.0, uWave2.x, d ), dn = smoothstep( uWave2.y, uWave2.y + uWave2.x, d );",
    "  return up * ( uWave2.z > 0.5 ? pow( max( 1.0 - pow( dn, 0.22 ), 0.0 ), 4.5454545 ) : 1.0 - dn );",
    "}",
    // the band riding the wave's front, d seconds after the wave reached this spot (see wave.band); going out, it's at
    // its brightest just as the light starts to go
    "float wb1( float d ) { float h = uBand.x, e = uBand.y, p = uBand.z * h;",
    "  float lv = d < p ? mix( uBand.w, 1.0, smoothstep( 0.0, p, d ) ) : mix( 1.0, uBand.w, smoothstep( p, h, d ) );",
    "  return smoothstep( - e, 0.0, d ) * ( 1.0 - smoothstep( h, h + e, d ) ) * lv; }",
    "float wband( float d ) { return max( max( wb1( d ), wb1( d - uWave.z ) ), uBand2.x * wb1( d - uWave2.y + uBand.z * uBand.x ) ); }",
    "float wh( float n ) { return fract( sin( n * 12.9898 + 78.233 ) * 43758.5453 ); }",
    // the subtle flicker once something is fully lit: slow drifting dips, a little shimmer and the odd quick dip
    // the flicker once things are fully lit, as one field over the whole wall (so a tube and the connectors meeting it
    // dip together): soft patches of dimming drifting across the network, and now and then a quick blink rippling
    // through a region (0 = no dip, 1 = fully out)
    "float wn2( vec2 p ) { vec2 i = floor( p ), f = fract( p ); f = f * f * ( 3.0 - 2.0 * f );",
    "  float a = wh( i.x * 7.0 + i.y * 131.0 ), b = wh( i.x * 7.0 + 7.0 + i.y * 131.0 ), c = wh( i.x * 7.0 + i.y * 131.0 + 131.0 ), d = wh( i.x * 7.0 + 7.0 + i.y * 131.0 + 131.0 );",
    "  return mix( mix( a, b, f.x ), mix( c, d, f.x ), f.y ); }",
    // the flicker as a brightness multiplier for something lit to level g at p (amount amt): applied to the light itself
    // (not its level: the lit tube's colour barely changes across its top levels, so a dimmer level hardly shows)
    "float wnet( vec2 p, float t );",
    "float wflk( vec2 p, float g, float amt, float t ) { return 1.0 - amt * smoothstep( 0.85, 1.0, g ) * wnet( p, t ); }",
    "float wnet( vec2 p, float t ) {",
    "  vec2 q = p / ( 2.2 * abs( uWave2.w ) );",
    "  float n = 0.6 * wn2( q + vec2( 0.35, 0.13 ) * t ) + 0.4 * wn2( 2.1 * q - vec2( 0.2, 0.5 ) * t + 7.3 );",
    "  float blink = pow( max( 0.0, sin( 6.2831853 * ( 0.23 * t + 0.5 * wn2( 0.3 * q + 3.7 ) ) ) ), 40.0 );",
    "  return max( 0.8 * smoothstep( 0.3, 0.8, n ), blink );",
    "}",
    "float wflick( float seed, float t ) {",

    if (still && Math.abs(d) < 1e-4) return;
    draw();
  }
  function resize() {
    const w = Math.max(1, box.clientWidth), h = Math.max(1, box.clientHeight);
    aspect = w / h;
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, CFG.maxPixelRatio));
    renderer.setSize(w, h, false);
    if (fixed) planCamera();
    if (wall) wall.setField();
  }
  new ResizeObserver(() => { resize(); draw(); }).observe(box);
  resize();
  new IntersectionObserver((es) => {
    const on = es[es.length - 1].isIntersecting;
    if (on === running) return;
    running = on; last = 0;
    renderer.setAnimationLoop(on ? loop : null);
  }).observe(box);
  draw();
}
</script>
