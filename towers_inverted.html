<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C test: towers, inverted</title>
<style>
  body { margin: 0; background: #10100E; color: #9a9a9a; font: 15px/1.5 system-ui, sans-serif; }
  .note { min-height: 60vh; display: flex; align-items: flex-end; justify-content: center; padding: 0 16px 40px; text-align: center; }
  .after { height: 60vh; }
</style>
</head>
<body>
<div class="note">Test page: the two towers exchanging blocks, colours inverted.</div>
<!--
  Two towers of the C's blocks for Webflow, with the colours inverted (yellow blocks, black/grey tubes), drawn with three.js from c_web.bin (it only borrows the block + tube piece
  and the Arnold look; the motion is made here). In Webflow: add a Code Embed where it goes and paste all of this in.

  What it does: two twisting towers of blocks glide continuously, the left one down and the right one up. Once a cycle,
  at the exchange height, they swap a pair of blocks (one swinging round the front, the other round the back), and as
  the exchange lands both towers light up in a sweep from the exchange outwards and then go out the same way, like the
  C. It loops forever, seamlessly. It doesn't react to scrolling.

  Light on purpose: nothing loads until it's about to scroll into view; three.js comes from a CDN only then; all the
  blocks are drawn in 2 draw calls; it only draws while on screen; the pixel ratio is capped at 2. Visitors who ask for
  reduced motion get it standing still. Put the URL of c_web.bin in data-src below (the same file as the C).
-->
<div class="c3d" data-src="c_web.bin" data-poster=""
     style="position:relative;width:100%;height:100vh;overflow:hidden"></div>

<script type="module">
const CFG = {
  three: "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  // the look, from your Arnold renders: shading spheres ("matcaps") rendered in Maya through your ACES view, next to
  // c_web.bin. c_tube.png holds the glass at `levels` steps from off to fully lit
  look: { block: "c_block.webp", tube: "c_tube.webp", levels: 8 },
  glow: 1.0,                 // a fully lit tube: 1 = the yellow of the Arnold render (lower is dimmer AND greener: ACES)
  brightness: 1.0,           // a lit tube's brightness, keeping its yellow (1 = as bright as the Arnold render)
  // the blocks' noise (like the noise in the C material, stuck to each block as it moves; each block its own):
  // amount = contrast of the noise, lift = how much it brightens the darkest faces, scale = noise cells per unit
  grain: { amount: 0.08, lift: 0.0, scale: 40 },   // softer than the black blocks': fine speckle shows up hard on yellow
  // the glass when it's off: how see-through it is facing you (Arnold's transmission 0.75), and how quickly it turns
  // into reflection toward its edges (higher = thinner reflective rim)
  glass: { clear: 0.75, edge: 3.0 },
  // each square shading the one below it: how dark right next to the square above, how far that reaches from its edge,
  // and how fast it fades as the gap between them grows (both as shares of the square's half size)
  shadow: { strength: 0.9, reach: 0.6, depth: 1.5 },
  // a lit tube's light on the face of its own square (Arnold's emission lighting the block): colour at the edge, and
  // how far in it reaches (as a share of the square's half size)
  spill: { color: [0.12, 0.19, 0.0], reach: 0.07, amount: 0.2 },   // amount: 1 = as in the Arnold render
  background: null,          // null = see-through (the section shows behind; your render's background is #10100E)
  maxPixelRatio: 2,
  // the colours swapped: the blocks take the neon's yellow (`color`, a painted yellow lit by the same sky: `ambient`
  // + `light` on the faces turned up to the sky, plus the C material's reflections at `shine`) and the tubes take the
  // blocks' black/grey; when the sweep lights a tower its tubes light up, from black/grey to the lit neon. `shadow`:
  // how dark a block's top gets under the one above (the black blocks' 0.9 turns yellow muddy)
  invert: { color: [0.80, 0.78, 0.12], ambient: 0.45, light: 0.6, shine: 1.0, shadow: 0.4 },
  // the camera: looking down at the towers from `elevation` degrees above, turned `azimuth` degrees round them, with a
  // `fov`-degree lens (a long lens: little distortion, but the near tower reads bigger); `height`: how many blocks tall
  // the view is; `shiftX` / `shiftY`: move the towers on screen (shares of the width / height), e.g. to leave room for text
  camera: { elevation: 24, azimuth: 32, fov: 22, height: 18, shiftX: 0.12, shiftY: 0 },
  // the towers bow apart in one even, round arc from top to bottom: widest at the exchange height, `gap` apart there
  // (share of a block), curving back in towards each other all the way to the top and bottom of the view, where they're
  // about `pinch` apart (`arc`: how far past the edge of the view the arc would close; higher = gentler, flatter;
  // `round`: the arc's shape, 1 = parabola, 0.5 = circle, in between = round with no flat stretches).
  // `depth`: how far apart they sit front to back (in blocks): the `front` tower (1 = right, -1 = left) in the
  // foreground, the other in the middle ground. `spacing` between blocks
  // in a tower (multiple of a block's thickness); `twist`: degrees each block turns from the one below (the two towers
  // twist opposite ways); `out`: how far the exchanging blocks swing out to pass each other (share of a block); `accel`:
  // how much of the exchange they spend easing up to speed and back down (the rest is one steady glide); `swing`:
  // how much they turn as they go (degrees); `flip`: turns the blocks over
  towers: { gap: 1.6, pinch: 0.3, arc: 1.15, round: 0.7, depth: 3, front: 1, spacing: 1.35, twist: 0.6, out: 1.6, swing: 18, accel: 0.35, flip: false },
  // the motion: the towers glide continuously (left down, right up), `blocks` blocks every `cycle` seconds; once a cycle
  // the blocks reaching the exchange height swap towers on the way, over `exchange` seconds (one swings round the front,
  // the other round the back, while both towers carry on)
  motion: { cycle: 10, blocks: 2, exchange: 3.4 },
  // as each exchange lands, both towers light up in a sweep from the exchange outwards and go out the same way, with the
  // C's own sweep timing (in frames at 24 fps after it lands, by distance from the exchange in blocks): one block every
  // `inStep` frames, each fading up over `ramp` (so several are fading up at once, a soft travelling front); going out
  // from `outStart`, one block every `outStep` frames, each fading out over `ramp`
  sweep: { inStep: 1.8, outStart: 110, outStep: 1.0, ramp: 16 },
};

document.querySelectorAll(".c3d[data-src]").forEach((box) => {
  const poster = box.dataset.poster;
  if (poster) {
    const img = new Image();
    img.src = poster; img.alt = ""; img.decoding = "async"; img.className = "c3d-poster";
    img.style.cssText = "position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .4s";
    box.appendChild(img);
  }
  const io = new IntersectionObserver((es) => {
    if (es.some((e) => e.isIntersecting)) { io.disconnect(); start(box).catch((e) => console.warn("[c3d]", e)); }
  }, { rootMargin: "300px" });
  io.observe(box);
});

// ------------------------------------------------------------------ the file
function parse(buf) {
  const dv = new DataView(buf);
  let o = 0;
  const pad = () => { o = (o + 3) & ~3; };
  const u32 = () => { const v = dv.getUint32(o, true); o += 4; return v; };
  const f32s = (k) => { const a = []; for (let i = 0; i < k; i++) { a.push(dv.getFloat32(o, true)); o += 4; } return a; };
  const arr = (T, k) => { const a = new T(buf.slice(o, o + k * T.BYTES_PER_ELEMENT)); o += k * T.BYTES_PER_ELEMENT; pad(); return a; };
  if (String.fromCharCode(...new Uint8Array(buf, 0, 4)) !== "CWEB") throw new Error("not a c_web.bin file");
  o = 4;
  const version = u32();
  if (version !== 4) throw new Error("c_web.bin version " + version + "; re-export with the latest export_c_web.py");
  const n = dv.getUint16(o, true), nParts = dv.getUint16(o + 2, true); o += 4;
  const nClips = u32(), fps = f32s(1)[0];
  const gq = f32s(6), sym = f32s(4);
  const cams = [];
  for (let k = 0; k < 2; k++) { const has = u32(), v = f32s(5); cams.push(has ? { x: v[0], y: v[1], z: v[2], hw: v[3], hh: v[4] } : null); }
  const parts = [];
  for (let p = 0; p < nParts; p++) {
    const mat = u32(), nv = u32(), ni = u32();
    const qp = arr(Uint16Array, nv * 3), qn = arr(Int8Array, nv * 4), idx = arr(Uint16Array, ni);
    const pos = new Float32Array(nv * 3), nor = new Float32Array(nv * 3);
    for (let v = 0; v < nv; v++) for (let a = 0; a < 3; a++) {
      pos[v * 3 + a] = gq[a] + qp[v * 3 + a] * gq[3 + a];
      nor[v * 3 + a] = qn[v * 4 + a] / 127;
    }
    parts.push({ mat, pos, nor, idx });
  }
  const clips = [];
  for (let c = 0; c < nClips; c++) {
    const nf = u32(), q = f32s(10);              // translation min (3), step (3), slope ranges (3 + 1)
    const tracks = [];
    for (let i = 0; i < n; i++) {
      const nt = u32(), nr = u32(), nc = u32();
      const tf = arr(Uint16Array, nt), tv = arr(Uint16Array, nt * 3), td = arr(Int16Array, nt * 3);
      const rf = arr(Uint16Array, nr), rv = arr(Int16Array, nr * 4), rd = arr(Int16Array, nr * 4);
      const cs = arr(Uint16Array, nc);
      const T = new Float32Array(nt * 3), TD = new Float32Array(nt * 3), R = new Float32Array(nr * 4), RD = new Float32Array(nr * 4);
      for (let k = 0; k < nt * 3; k++) { const a = k % 3; T[k] = q[a] + tv[k] * q[3 + a]; TD[k] = td[k] / 32767 * q[6 + a]; }
      for (let k = 0; k < nr * 4; k++) { R[k] = rv[k] / 32767; RD[k] = rd[k] / 32767 * q[9]; }
      const cut = new Uint8Array(nf);
      for (const f of cs) cut[f] = 1;
      tracks.push({ tf, T, TD, rf, R, RD, cut, ct: 0, cr: 0 });
    }
    clips.push({ nf, tracks });
  }
  return { n, fps, sym, cams, parts, loop: clips[0], scroll: clips[1] };
}

// a track's curve at frame f (Hermite: each key has its value and slope); across a cut it holds, then jumps
function hermite(frames, V, D, dim, f, cur, cut, out) {
  let j = cur;
  if (f < frames[j] || j > frames.length - 2) j = 0;
  while (j < frames.length - 2 && frames[j + 1] <= f) j++;
  const f0 = frames[j], h = frames[j + 1] - f0, i0 = j * dim, i1 = i0 + dim;
  if (cut[f0] && h === 1) { for (let k = 0; k < dim; k++) out[k] = V[i0 + k]; return j; }
  const u = (f - f0) / h, u2 = u * u, u3 = u2 * u;
  const a = 2 * u3 - 3 * u2 + 1, b = (u3 - 2 * u2 + u) * h, c = -2 * u3 + 3 * u2, d = (u3 - u2) * h;
  for (let k = 0; k < dim; k++) out[k] = a * V[i0 + k] + b * D[i0 + k] + c * V[i1 + k] + d * D[i1 + k];
  return j;
}
const smoothstep = (x) => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };

// ------------------------------------------------------------------ the scene
async function start(box) {
  const [THREE, data] = await Promise.all([
    import(CFG.three),
    fetch(box.dataset.src).then((r) => { if (!r.ok) throw new Error("c_web.bin: HTTP " + r.status); return r.arrayBuffer(); }),
  ]);
  const C = parse(data);

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: CFG.background === null, powerPreference: "high-performance" });
  } catch (e) { console.warn("[c3d] no WebGL, keeping the poster"); return; }
  if (CFG.background !== null) renderer.setClearColor(CFG.background, 1);
  const canvas = renderer.domElement;
  canvas.style.cssText = "position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .4s";
  box.appendChild(canvas);

  const scene = new THREE.Scene();
  const base = new URL(box.dataset.src, location.href);
  const loader = new THREE.TextureLoader();
  const tex = (name) => new Promise((ok, no) => loader.load(new URL(name, base).href, (t) => {
    t.colorSpace = THREE.SRGBColorSpace; t.generateMipmaps = false; t.minFilter = THREE.LinearFilter; ok(t);
  }, undefined, no));
  const [blockTex, tubeTex] = await Promise.all([tex(CFG.look.block), tex(CFG.look.tube)]);

  // the square's own frame (from the block's geometry): its thickness axis, two in-plane edge directions, half size
  const blk = C.parts.find((p) => p.mat === 0) || C.parts[0];
  const nAx = new THREE.Vector3(C.sym[0], C.sym[1], C.sym[2]).normalize();
  let uAx = null, best = 0;
  for (let k = 0; k < blk.nor.length; k += 3) {
    const v = new THREE.Vector3(blk.nor[k], blk.nor[k + 1], blk.nor[k + 2]);
    if (Math.abs(v.dot(nAx)) > 0.1) continue;
    v.addScaledVector(nAx, -v.dot(nAx)).normalize();
    let votes = 0;
    for (let j = 0; j < blk.nor.length; j += 3) {
      const w = new THREE.Vector3(blk.nor[j], blk.nor[j + 1], blk.nor[j + 2]);
      if (Math.abs(w.dot(nAx)) < 0.1 && Math.abs(Math.abs(w.dot(v)) - 1) < 0.02) votes++;
    }
    if (votes > best) { best = votes; uAx = v; }
  }
  if (!uAx) uAx = new THREE.Vector3(1, 0, 0).cross(nAx).normalize();
  const vAx = new THREE.Vector3().crossVectors(nAx, uAx).normalize();
  let half = 0, thick = 0;
  for (let k = 0; k < blk.pos.length; k += 3) {
    const p = new THREE.Vector3(blk.pos[k], blk.pos[k + 1], blk.pos[k + 2]);
    half = Math.max(half, Math.abs(p.dot(uAx)), Math.abs(p.dot(vAx)));
    thick = Math.max(thick, Math.abs(p.dot(nAx)));
  }
  // the tube's corner rounding (from its own shape), so the glow and the shading round the corners the same way
  let rTube = 0.1 * half;
  const tub = C.parts.find((p) => p.mat === 1);
  if (tub) {
    let ax = 0, dg = 0;
    for (let k = 0; k < tub.pos.length; k += 3) {
      const p = new THREE.Vector3(tub.pos[k], tub.pos[k + 1], tub.pos[k + 2]), a = Math.abs(p.dot(uAx)), b = Math.abs(p.dot(vAx));
      ax = Math.max(ax, a, b); dg = Math.max(dg, (a + b) / Math.SQRT2);
    }
    rTube = Math.min(Math.max((ax * Math.SQRT2 - dg) / (Math.SQRT2 - 1), 0), half);
  }
  const rGlow = Math.max(rTube, 3 * CFG.spill.reach * half), rShade = Math.max(rTube, 0.5 * CFG.shadow.reach * half);

  // matcap shading, read straight down (orthographic), with a per-square glow (the sweep)
  const ORTHO = "vec3 viewDir = vec3( 0.0, 0.0, 1.0 );";
  const withGlow = (sh, local) => {
    sh.vertexShader = "attribute float aGlow;\nvarying float vGlow;\n" + (local ? "varying vec3 vLocal, vLocalN;\n" : "") +
      sh.vertexShader.replace("#include <begin_vertex>", "#include <begin_vertex>\nvGlow = aGlow;" + (local ? "\nvLocal = position; vLocalN = normal;" : ""));
    sh.fragmentShader = "varying float vGlow;\n" + (local ? "varying vec3 vLocal, vLocalN;\n" : "") +
      sh.fragmentShader.replace("vec3 viewDir = normalize( vViewPosition );", ORTHO);
  };
  const IV = CFG.invert;
  const blockMat = new THREE.MeshMatcapMaterial({ matcap: blockTex });
  blockMat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, { uGrain: { value: new THREE.Vector3(CFG.grain.amount, CFG.grain.lift, CFG.grain.scale) },
      uShadow: { value: new THREE.Vector3(IV ? IV.shadow : CFG.shadow.strength, CFG.shadow.reach * half, CFG.shadow.depth * half) },
      uThick: { value: thick }, uRound: { value: new THREE.Vector2(rGlow, rShade) } });
    Object.assign(sh.uniforms, { uU: { value: uAx }, uV: { value: vAx }, uN: { value: nAx }, uHalf: { value: half },
      uSpill: { value: new THREE.Color().fromArray(CFG.spill.color).multiplyScalar(CFG.spill.amount) }, uReach: { value: CFG.spill.reach * half } });
    withGlow(sh, true);
    if (IV) Object.assign(sh.uniforms, { uInvC: { value: new THREE.Vector3().fromArray(IV.color) },
      uInvK: { value: new THREE.Vector4(IV.ambient, IV.light, IV.shine, 0) },
      uNeon: { value: new THREE.Color(0xeff26d).convertSRGBToLinear() } });
    sh.vertexShader = "varying float vInst;\nattribute vec4 aOccA, aOccB, aOccC, aOccD;\nvarying vec3 vOccL;\n" +
      sh.vertexShader.replace("vGlow = aGlow;", "vGlow = aGlow;\nvInst = float( gl_InstanceID );\n" +
        "vOccL = ( mat4( aOccA, aOccB, aOccC, aOccD ) * ( instanceMatrix * vec4( position, 1.0 ) ) ).xyz;");
    sh.fragmentShader = (IV ? "uniform vec3 uInvC, uNeon;\nuniform vec4 uInvK;\n" : "") + "uniform vec3 uU, uV, uN, uSpill, uGrain, uShadow;\nuniform float uHalf, uReach, uThick;\nuniform vec2 uRound;\nvarying float vInst;\nvarying vec3 vOccL;\n" +
      "float rsq( vec2 p, float a, float r ) { vec2 q = abs( p ) - vec2( a - r ); return length( max( q, 0.0 ) ) + min( max( q.x, q.y ), 0.0 ) - r; }\n" +
      "float h3( vec3 p ) { p = fract( p * 0.3183099 + 0.1 ); p *= 17.0; return fract( p.x * p.y * p.z * ( p.x + p.y + p.z ) ); }\n" +
      "float vn( vec3 x ) { vec3 i = floor( x ), f = fract( x ); f = f * f * ( 3.0 - 2.0 * f );\n" +
      "  return mix( mix( mix( h3( i ), h3( i + vec3( 1, 0, 0 ) ), f.x ), mix( h3( i + vec3( 0, 1, 0 ) ), h3( i + vec3( 1, 1, 0 ) ), f.x ), f.y ),\n" +
      "              mix( mix( h3( i + vec3( 0, 0, 1 ) ), h3( i + vec3( 1, 0, 1 ) ), f.x ), mix( h3( i + vec3( 0, 1, 1 ) ), h3( i + vec3( 1, 1, 1 ) ), f.x ), f.y ), f.z ); }\n" +
      sh.fragmentShader.replace(
      "vec3 outgoingLight = diffuseColor.rgb * matcapColor.rgb;",
      "vec3 outgoingLight = diffuseColor.rgb * matcapColor.rgb;\n" +
      // inverted: a yellow block, lit from the sky above (the face's direction in the world), with the C material's
      // reflections on top
      (IV ? "vec3 nW = normalize( ( vec4( normal, 0.0 ) * viewMatrix ).xyz );\n" +
        "outgoingLight = uInvC * ( uInvK.x + uInvK.y * max( dot( nW, normalize( vec3( 0.25, 1.0, 0.35 ) ) ), 0.0 ) ) + uInvK.z * matcapColor.rgb;\n" : "") +
      "vec3 gp = vLocal * uGrain.z + vInst * 7.13;\n" +
      "float gn = 0.65 * vn( gp ) + 0.35 * vn( gp * 2.3 + 11.7 );\n" +
      "outgoingLight = outgoingLight * ( 1.0 + uGrain.x * ( 2.0 * gn - 1.0 ) ) + uGrain.y * gn;\n" +
      "float od = rsq( vec2( dot( vOccL, uU ), dot( vOccL, uV ) ), uHalf, uRound.y );\n" +
      "float oh = max( abs( dot( vOccL, uN ) ) - uThick, 0.0 );\n" +
      "outgoingLight *= 1.0 - uShadow.x * exp( - max( od, 0.0 ) / uShadow.y ) * exp( - oh / uShadow.z );\n" +
      "float edge = - rsq( vec2( dot( vLocal, uU ), dot( vLocal, uV ) ), uHalf, uRound.x );\n" +
      "float face = smoothstep( 0.6, 0.9, abs( dot( normalize( vLocalN ), uN ) ) );\n" +
      "outgoingLight += vGlow * face * uSpill * exp( - max( edge, 0.0 ) / uReach );" +
      "");
  };
  // the glass: its reflections added on top, what's behind showing through (less toward its edges); lit, it's solid
  const tubeMat = new THREE.MeshMatcapMaterial({ matcap: tubeTex, transparent: true, depthWrite: false,
    blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
    blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneMinusSrcAlphaFactor });
  tubeMat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, { uLevels: { value: CFG.look.levels }, uGlass: { value: new THREE.Vector3(CFG.glass.clear, CFG.glass.edge, Math.max(CFG.glow, 1e-3)) },
      uBright: { value: CFG.brightness } });
    withGlow(sh, false);
    sh.fragmentShader = "uniform float uLevels, uBright;\nuniform vec3 uGlass;\n" + sh.fragmentShader.replace(
      "vec3 outgoingLight = diffuseColor.rgb * matcapColor.rgb;",
      "vec3 outgoingLight = diffuseColor.rgb * matcapColor.rgb;\n" +
      "float ndv = clamp( abs( normal.z ), 0.0, 1.0 );\n" +
      "diffuseColor.a = max( mix( 1.0 - uGlass.x, 1.0, pow( 1.0 - ndv, uGlass.y ) ), clamp( vGlow, 0.0, 1.0 ) );").replace(
      "vec4 matcapColor = texture2D( matcap, uv );",
      "float lv = clamp( vGlow * uGlass.z, 0.0, 1.0 ) * ( uLevels - 1.0 ), l0 = min( floor( lv ), uLevels - 2.0 );\n" +
      "vec4 matcapColor = mix( texture2D( matcap, vec2( ( l0 + uv.x ) / uLevels, uv.y ) ),\n" +
      "                        texture2D( matcap, vec2( ( l0 + 1.0 + uv.x ) / uLevels, uv.y ) ), lv - l0 );\n" +
      "matcapColor.rgb *= mix( 1.0, uBright, clamp( vGlow, 0.0, 1.0 ) );");
  };
  // inverted: the tubes in the blocks' black/grey (their shading sphere, read the same way), solid; lit by the sweep they
  // light up to the neon (the lit glass's own shading spheres), the way the tubes light on the other pages
  let tubeDark = null;
  if (IV) {
    tubeDark = new THREE.MeshMatcapMaterial({ matcap: blockTex });
    tubeDark.onBeforeCompile = (sh) => {
      Object.assign(sh.uniforms, { uLit: { value: tubeTex }, uLevels: { value: CFG.look.levels }, uGl: { value: Math.max(CFG.glow, 1e-3) }, uBright: { value: CFG.brightness } });
      withGlow(sh, false);
      sh.fragmentShader = "uniform sampler2D uLit;\nuniform float uLevels, uGl, uBright;\n" + sh.fragmentShader.replace(
        "vec4 matcapColor = texture2D( matcap, uv );",
        "vec4 matcapColor = texture2D( matcap, uv );\n" +
        "float g = clamp( vGlow, 0.0, 1.0 ), lv = clamp( vGlow * uGl, 0.0, 1.0 ) * ( uLevels - 1.0 ), l0 = min( floor( lv ), uLevels - 2.0 );\n" +
        "vec4 lit = mix( texture2D( uLit, vec2( ( l0 + uv.x ) / uLevels, uv.y ) ), texture2D( uLit, vec2( ( l0 + 1.0 + uv.x ) / uLevels, uv.y ) ), lv - l0 );\n" +
        "matcapColor.rgb = mix( matcapColor.rgb, lit.rgb * mix( 1.0, uBright, g ), smoothstep( 0.0, 0.35, g ) );");
    };
  }
  const mats = [blockMat, IV ? tubeDark : tubeMat];
  const NI = 160;                              // instance capacity (the towers use what the view needs)
  const glow = new THREE.InstancedBufferAttribute(new Float32Array(NI), 1);
  glow.setUsage(THREE.DynamicDrawUsage);
  // for the shading: every square gets the inverse transform of the square above it
  const occ = [0, 1, 2, 3].map(() => { const a = new THREE.InstancedBufferAttribute(new Float32Array(NI * 4), 4); a.setUsage(THREE.DynamicDrawUsage); return a; });
  const all = [];
  const meshes = C.parts.map((p) => {

  const R0 = new THREE.Quaternion().setFromRotationMatrix(T.flip
    ? new THREE.Matrix4().makeBasis(uAx, nAx.clone().negate(), vAx).invert()
    : new THREE.Matrix4().makeBasis(uAx, nAx, vAx.clone().negate()).invert());
  // how thick the whole piece (block + tube) is
  let tk = 0;
  for (const p of C.parts) for (let k = 0; k < p.pos.length; k += 3) tk = Math.max(tk, Math.abs(p.pos[k] * nAx.x + p.pos[k + 1] * nAx.y + p.pos[k + 2] * nAx.z));
  const size = 2 * half, P = Math.max(T.spacing, 1.05) * 2 * tk;      // block size, and the height from one block to the next
  // a tower's centre at height y (side -1: left, +1: right): widest apart at the exchange height, curving back in above
  // and below
  const Xin = size / 2 + T.pinch * size / 2, X0 = size / 2 + T.gap * size / 2;
  const bendUp = { [-1]: 10 * P, [1]: 10 * P }, bendDn = { [-1]: 10 * P, [1]: 10 * P };   // per tower, set by the framing
  // one round arc from top to bottom (between a parabola and a circle: no straight stretches, no corners): widest at the
  // exchange, reaching `pinch` apart just past the top and bottom of the view (past that, out of sight, they stay put)
  // (side to side across the screen, not along the world's x, so both towers sit at the same depth before `depth`)
  const bowW = (y, side) => { const q = Math.min(y >= 0 ? y / bendUp[side] : -y / bendDn[side], 1); return Xin + (X0 - Xin) * Math.pow(1 - q * q, T.round || 0.7); };
  const xOf = (y, side) => dOf(side) * los.x + side * bowW(y, side) * Math.cos(az);
  // front to back: the front tower nearer the camera, the other further away (along the camera's direction)
  const dOf = (side) => (side === (T.front || 1) ? 0.5 : -0.5) * (T.depth || 0) * size;
  const UP = new THREE.Vector3(0, 1, 0), qY = new THREE.Quaternion(), pos = new THREE.Vector3(), one = new THREE.Vector3(1, 1, 1), M = new THREE.Matrix4();
  const ease = (x) => { x = Math.min(1, Math.max(0, x)); return x * x * x * (x * (6 * x - 15) + 10); };

  // the camera
  const camera = new THREE.PerspectiveCamera(CFG.camera.fov || 22, 1, 0.1, 5000);
  const el = THREE.MathUtils.degToRad(CFG.camera.elevation), az = THREE.MathUtils.degToRad(CFG.camera.azimuth), D = 200;
  camera.position.set(D * Math.cos(el) * Math.sin(az), D * Math.sin(el), D * Math.cos(el) * Math.cos(az));
  camera.lookAt(0, 0, 0);
  const back = camera.position.clone().normalize(), target = new THREE.Vector3();
  // front to back along the camera's line of sight (so both towers sit at the same height on screen, one nearer)
  const los = back.clone();                                         // towards the camera from the exchange (see frameCamera)
  const zOf = (y, side) => dOf(side) * los.z - side * bowW(y, side) * Math.sin(az), yOf = (side) => dOf(side) * los.y;

  let aspect = 1, J = 8;
  camera.updateMatrixWorld();
  const cR = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0), cU = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
  const nH = new THREE.Vector3(Math.sin(az), 0, Math.cos(az)), ray = new THREE.Vector3();
  // the height where the edge of the view (ndcY: 1 top, -1 bottom) meets the towers' plane
  function edgeY(ndcY, side) {
    ray.set(0, ndcY, 0.5).unproject(camera).sub(camera.position);
    const p0 = los.clone().multiplyScalar(dOf(side));                 // that tower's plane, through its exchange point
    const t = nH.dot(p0.sub(camera.position)) / nH.dot(ray);
    return camera.position.y + t * ray.y - yOf(side);
  }
  function placeCamera(hh, cx, cy) {
    // the long lens framed to show that much at the towers: back off until the view is hh high there, aimed at (cx, cy)
    const dist = hh / Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
    target.copy(cR).multiplyScalar(cx).addScaledVector(cU, cy);
    camera.position.copy(target).addScaledVector(back, dist);

    camera.updateProjectionMatrix();

  }
  function frameCamera() {
    // the arc is fitted to the height actually in view at the towers, above and below the exchange separately (the
    // camera looks down, so it sees further below), so it runs evenly from the very top to the very bottom; and the view
    // is widened if the towers need it
    let hh = CFG.camera.height * P / 2, x0 = 0, x1 = 0, cx = 0, cy = 0, hw = 0;
    const v = new THREE.Vector3();
    for (let pass = 0; pass < 5; pass++) {
      placeCamera(hh, cx, cy);
      los.copy(camera.position).normalize();                          // the line from the exchange to the camera
      let yTop = -1e9, yBot = 1e9;
      for (const sd of [-1, 1]) {
        const yt = edgeY(1, sd), yb = edgeY(-1, sd);
        bendUp[sd] = Math.max(yt, P) * (T.arc || 1.15); bendDn[sd] = Math.max(-yb, P) * (T.arc || 1.15);
        yTop = Math.max(yTop, yt); yBot = Math.min(yBot, yb);
      }
      x0 = 1e9; x1 = -1e9;
      for (let y = yBot - P; y <= yTop + P; y += P / 2) for (const sd of [-1, 1]) {
        const sx = v.set(xOf(y, sd), y + yOf(sd), zOf(y, sd)).dot(cR);
        x0 = Math.min(x0, sx - 0.8 * size); x1 = Math.max(x1, sx + 0.8 * size);
      }
      x0 = Math.min(x0, -(X0 + 0.8 * size) * Math.cos(az) - T.out * size * Math.sin(az));
      x1 = Math.max(x1, (X0 + 0.8 * size) * Math.cos(az) + T.out * size * Math.sin(az));
      hh = Math.max(CFG.camera.height * P / 2, (x1 - x0) / 2 / Math.max(aspect, 1e-3) / (1 - 2 * Math.abs(CFG.camera.shiftX || 0)));
      hw = hh * aspect; cx = (x0 + x1) / 2 - (CFG.camera.shiftX || 0) * 2 * hw; cy = -(CFG.camera.shiftY || 0) * 2 * hh;
    }
    placeCamera(hh, cx, cy);
    los.copy(camera.position).normalize();
    // enough blocks above and below to fill the view (the ones that wrap round are out of sight)
    J = Math.min(Math.floor((NI / 2 - 1) / 2), Math.ceil((hh * (1 + 2 * Math.abs(CFG.camera.shiftY || 0)) / Math.cos(el) + size) / P) + 2);
  }

  // the timing: a step is one block of travel; the exchange happens in the first step of each cycle
  const MO2 = CFG.motion, BL = Math.max(1, Math.round(MO2.blocks)), S = MO2.cycle / BL, E = Math.min(MO2.exchange / S, 0.95);
  const SW = CFG.sweep;
  // a block's light, at d blocks from the exchange, sec seconds after the last exchange landed
  function lightAt(d, sec) {
    const f = sec * 24, a = SW.inStep * d, b = SW.outStart + SW.outStep * d;
    return smoothstep((f - a) / SW.ramp) * (1 - smoothstep((f - b) / SW.ramp));
  }
  const inst = [], above = new Int16Array(NI), INV = new THREE.Matrix4(), FAR = new THREE.Matrix4().makeTranslation(1e4, 1e4, 1e4);
  for (let i = 0; i < NI; i++) inst.push(new THREE.Matrix4());
  let count = 0, forceGlow = null;
  // each block keeps its own index (and so its own grain) as it travels: slot k of a tower, round its NJ places
  function put(i, x, y, yaw, g, z = 0) {
    qY.setFromAxisAngle(UP, yaw).multiply(R0);
    inst[i].compose(pos.set(x, y, z), qY, one);
    glow.array[i] = forceGlow !== null ? forceGlow : g;
  }
  const tw = THREE.MathUtils.degToRad(T.twist);
  // one block's way from one tower to the other while both keep moving: u (0..1) through its exchange; it follows its
  // old slot (yFrom, moving) and eases over to its new one (yTo, moving the other way), swinging out (zs: in front or
  // behind) and turning a little as it goes, all in one smooth curve
  const sw = THREE.MathUtils.degToRad(T.swing || 0);
  // One continuous movement, no stops: it slides straight out of its tower like a drawer (towards the camera from the
  // front tower, away from it from the back one, square to the gap), rounds a soft corner, travels across (staying that
  // far out, clear of both towers), rounds another and slides straight into the other tower; it moves along that path at one smooth pace (easing
  // in at the start and out at the end only), turning a little on the way. (lateral: across the screen; depth: towards
  // the camera)
  // its pace along the path: eases up to speed over the first `accel` of it, glides at that steady speed, and eases to a
  // stop over the last `accel` (a steady glide, rather than speeding through the middle)
  const GT = new Float32Array(129);
  { const a = Math.min(Math.max(T.accel || 0.35, 0.05), 0.5); let acc = 0;
    for (let k = 1; k <= 128; k++) { const q = (k - 0.5) / 128; acc += smoothstep(q / a) * smoothstep((1 - q) / a); GT[k] = acc; }
    for (let k = 1; k <= 128; k++) GT[k] /= acc; }

  const PT = [];
  for (let k = 0; k < 40; k++) PT.push([0, 0]);
  function pathAt(s0, pts, n) {                                       // the point at arc length s0 along pts[0..n)
    let acc = 0;
    for (let k = 1; k < n; k++) {
      const dl = Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]);
      if (acc + dl >= s0 || k === n - 1) { const f = dl > 0 ? Math.min(1, (s0 - acc) / dl) : 0; return [pts[k - 1][0] + (pts[k][0] - pts[k - 1][0]) * f, pts[k - 1][1] + (pts[k][1] - pts[k - 1][1]) * f]; }
      acc += dl;
    }
    return pts[n - 1];
  }
  function hop(i, u, yFrom, sFrom, yTo, sTo, zs, g) {
    const xf = xOf(yFrom, sFrom), zf = zOf(yFrom, sFrom), xt = xOf(yTo, sTo), zt = zOf(yTo, sTo);
    const Lf = xf * Math.cos(az) - zf * Math.sin(az), Df = xf * Math.sin(az) + zf * Math.cos(az);
    const Lt = xt * Math.cos(az) - zt * Math.sin(az), Dt = xt * Math.sin(az) + zt * Math.cos(az);
    const so = zs * T.out * size, r = 0.45 * size;
    // the path: out, a rounded corner, across, a rounded corner, in
    const P1 = [Lf, Df + so], P2 = [Lt, Df + so];                    // across at its own side's distance, then straight in
    const toward = (a, b, d) => { const l = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, q = Math.min(d / l, 0.49); return [a[0] + (b[0] - a[0]) * q, a[1] + (b[1] - a[1]) * q]; };
    const A1 = toward(P1, [Lf, Df], r), B1 = toward(P1, P2, r), A2 = toward(P2, P1, r), B2 = toward(P2, [Lt, Dt], r);
    let n = 0;
    PT[n][0] = Lf; PT[n++][1] = Df;
    const quad = (a, c, b) => { for (let k = 0; k <= 8; k++) { const q = k / 8, m = 1 - q; PT[n][0] = m * m * a[0] + 2 * m * q * c[0] + q * q * b[0]; PT[n++][1] = m * m * a[1] + 2 * m * q * c[1] + q * q * b[1]; } };
    quad(A1, P1, B1); quad(A2, P2, B2);
    PT[n][0] = Lt; PT[n++][1] = Dt;
    let len = 0;
    for (let k = 1; k < n; k++) len += Math.hypot(PT[k][0] - PT[k - 1][0], PT[k][1] - PT[k - 1][1]);
    const [L, D] = pathAt(glide(u) * len, PT, n);

    const b = Math.abs(Lt - Lf) > 1e-6 ? Math.min(Math.max((L - Lf) / (Lt - Lf), 0), 1) : ease(u);
    const y = yFrom + yOf(sFrom) + (yTo + yOf(sTo) - yFrom - yOf(sFrom)) * b;
    const yaw = (sFrom * -tw * yFrom / P) * (1 - b) + (sTo * -tw * yTo / P) * b + zs * sw * Math.sin(Math.PI * b);

    const exch = ((fo % BL) + BL) % BL === 0 && fr < E;               // this step's exchange, while it lasts
    const sec = ((((o - E) % BL) + BL) % BL) * S;                     // seconds since the last exchange landed
    const NJ = 2 * J + 1, md = (k) => ((k % NJ) + NJ) % NJ;

        // passes through a tower
        const fz = (side) => side === (T.front || 1) ? 1 : -1;
        hop(iA, u, yB, 1, yA, -1, fz(1), gA);                         // the right tower's block, into the left
        hop(iB, u, yA, -1, yB, 1, fz(-1), gB);                        // the left tower's block, into the right
      } else {
        put(iA, xOf(yA, -1), yA + yOf(-1), tw * yA / P, gA, zOf(yA, -1));
        put(iB, xOf(yB, 1), yB + yOf(1), -tw * yB / P, gB, zOf(yB, 1));

  }

  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let clock = still ? 0 : 0, last = 0, running = false, shown = false;
  function draw() {
    layout(still ? S * (E + 0.4) : clock);
    for (let i = 0; i < count; i++) for (const mm of meshes) mm.setMatrixAt(i, inst[i]);
    // the block above each block (the next one up in its tower), for the shading
    for (let i = 0; i < count; i++) {
      const best = above[i];
      const el2 = best < 0 ? FAR.elements : INV.copy(inst[best]).invert().elements;
      for (let k = 0; k < 4; k++) occ[k].array.set(el2.slice(k * 4, k * 4 + 4), i * 4);
    }

    for (const mm of meshes) mm.instanceMatrix.needsUpdate = true;

    for (const a of occ) a.needsUpdate = true;

  box.__c3d = { C, meshes, glow, draw, camera, set: (t) => { clock = t; draw(); },

}
