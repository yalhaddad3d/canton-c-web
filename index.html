<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C test</title>
<style>
  body { margin: 0; background: #262626; color: #9a9a9a; font: 15px/1.5 system-ui, sans-serif; }
  .note { min-height: 70vh; display: flex; align-items: flex-end; justify-content: center; padding: 0 16px 40px; text-align: center; }
  .stage { width: min(700px, 100% - 32px); margin: 0 auto; }
  .after { height: 150vh; }
</style>
</head>
<body>
<div class="note">Test page for the 3D C. Scroll down: it loads as it comes into view, flat top view.</div>
<div class="stage">
<!--
  The animated C for Webflow, played from c_web.bin (made by export_c_web.py in Houdini) with three.js.
  In Webflow: add an Embed element where the C goes and paste all of this into it.

  1. Host c_web.bin somewhere the page can fetch it, and put its URL in data-src below (see the notes at the bottom).
  2. Optional: a still of the C in data-poster (shown until the 3D draws, and kept for the rare visitor without WebGL).
  3. Size the box in Webflow (or change the style below). The C is framed to fit inside it at any size.

  What it does to stay light: nothing loads until the C is about to scroll into view; three.js comes from a CDN only
  then; all 60 squares are drawn in 2 draw calls; it stops drawing whenever the C is off screen or the tab is hidden;
  the pixel ratio is capped at 2; visitors who ask for reduced motion get a still frame. Works on WebGL, so every
  current browser shows it (no WebGPU needed).
-->
<div class="c3d" data-src="https://cdn.jsdelivr.net/gh/yalhaddad3d/canton-c-web@v1/c_web.bin" data-poster=""
     style="position:relative;width:100%;aspect-ratio:1/1;overflow:hidden"></div>

<script type="module">
const CFG = {
  three: "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  block: { color: "#000000", roughness: 0.6, metalness: 0.0 },                 // the squares
  tube: { color: "#DFFF3F", emissive: "#DFFF3F", emissiveIntensity: 0.35, roughness: 0.3, metalness: 0.0 },
  reflections: 0.5,          // how much the studio light reflects in the blocks (0 = none, 1 = full)
  background: null,          // null = see-through (the Webflow section shows behind); or e.g. "#262626"
  view: "top",               // "top": straight down from the top; "auto": the Houdini camera if the file has one
  projection: "orthographic", // for the top view: "orthographic" (flat, no perspective) or "perspective"
  zoom: 1.0,                 // > 1 fills more of the box
  speed: 1.0,                // 1 = Houdini's timing
  maxPixelRatio: 2,
  tilt: null,                // scroll tilt, off so the top view stays flat; e.g. { x: 12, y: -10, over: 400 } (degrees, over px)
};

const boxes = document.querySelectorAll(".c3d[data-src]");
boxes.forEach((box) => {
  const poster = box.dataset.poster;
  if (poster) {
    const img = new Image();
    img.src = poster; img.alt = ""; img.decoding = "async";
    img.className = "c3d-poster";
    img.style.cssText = "position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .4s";
    box.appendChild(img);
  }
  const io = new IntersectionObserver((es) => {
    if (es.some((e) => e.isIntersecting)) { io.disconnect(); start(box).catch((e) => console.warn("[c3d]", e)); }
  }, { rootMargin: "300px" });
  io.observe(box);
});

// ------------------------------------------------------------------ the file
function parse(buf) {
  const dv = new DataView(buf);
  let o = 0;
  const pad = () => { o = (o + 3) & ~3; };
  const u32 = () => { const v = dv.getUint32(o, true); o += 4; return v; };
  const f32s = (k) => { const a = []; for (let i = 0; i < k; i++) { a.push(dv.getFloat32(o, true)); o += 4; } return a; };
  const arr = (T, k) => { const a = new T(buf.slice(o, o + k * T.BYTES_PER_ELEMENT)); o += k * T.BYTES_PER_ELEMENT; pad(); return a; };
  if (String.fromCharCode(...new Uint8Array(buf, 0, 4)) !== "CWEB") throw new Error("not a c_web.bin file");
  o = 4;
  const version = u32();
  if (version !== 3) throw new Error("c_web.bin version " + version + "; re-export with export_c_web.py");
  const n = dv.getUint16(o, true), nParts = dv.getUint16(o + 2, true); o += 4;
  const nf = u32(), fps = f32s(1)[0];
  const tq = f32s(6), gq = f32s(6), bounds = f32s(4);
  const camType = u32(), camM = f32s(16), camHW = f32s(2), slope = f32s(4);
  const parts = [];
  for (let p = 0; p < nParts; p++) {
    const mat = u32(), nv = u32(), ni = u32();
    const qp = arr(Uint16Array, nv * 3), qn = arr(Int8Array, nv * 4), idx = arr(Uint16Array, ni);
    const pos = new Float32Array(nv * 3), nor = new Float32Array(nv * 3);
    for (let v = 0; v < nv; v++) for (let a = 0; a < 3; a++) {
      pos[v * 3 + a] = gq[a] + qp[v * 3 + a] * gq[3 + a];
      nor[v * 3 + a] = qn[v * 4 + a] / 127;
    }
    parts.push({ mat, pos, nor, idx });
  }
  const tracks = [];
  for (let i = 0; i < n; i++) {
    const nt = u32(), nr = u32();
    const tf = arr(Uint16Array, nt), tv = arr(Uint16Array, nt * 3), td = arr(Int16Array, nt * 3);
    const rf = arr(Uint16Array, nr), rv = arr(Int16Array, nr * 4), rd = arr(Int16Array, nr * 4);
    const T = new Float32Array(nt * 3), TD = new Float32Array(nt * 3), R = new Float32Array(nr * 4), RD = new Float32Array(nr * 4);
    for (let k = 0; k < nt * 3; k++) { const a = k % 3; T[k] = tq[a] + tv[k] * tq[3 + a]; TD[k] = td[k] / 32767 * slope[a]; }
    for (let k = 0; k < nr * 4; k++) { R[k] = rv[k] / 32767; RD[k] = rd[k] / 32767 * slope[3]; }
    tracks.push({ tf, T, TD, rf, R, RD, ct: 0, cr: 0 });
  }
  return { n, nf, fps, bounds, camType, camM, camHW, parts, tracks };
}

// the curve through a track's keys at frame f (Hermite: each key has its value and slope)
function hermite(frames, V, D, dim, f, cur, out) {
  let j = cur;
  if (f < frames[j] || j > frames.length - 2) j = 0;
  while (j < frames.length - 2 && frames[j + 1] <= f) j++;
  const f0 = frames[j], h = frames[j + 1] - f0, u = (f - f0) / h, u2 = u * u, u3 = u2 * u;
  const a = 2 * u3 - 3 * u2 + 1, b = (u3 - 2 * u2 + u) * h, c = -2 * u3 + 3 * u2, d = (u3 - u2) * h;
  const i0 = j * dim, i1 = i0 + dim;
  for (let k = 0; k < dim; k++) out[k] = a * V[i0 + k] + b * D[i0 + k] + c * V[i1 + k] + d * D[i1 + k];
  return j;
}

// ------------------------------------------------------------------ the scene
async function start(box) {
  const [THREE, data] = await Promise.all([
    import(CFG.three),
    fetch(box.dataset.src).then((r) => { if (!r.ok) throw new Error("c_web.bin: HTTP " + r.status); return r.arrayBuffer(); }),
  ]);
  const C = parse(data);

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: CFG.background === null, powerPreference: "high-performance" });
  } catch (e) { console.warn("[c3d] no WebGL, keeping the poster"); return; }
  if (CFG.background !== null) renderer.setClearColor(CFG.background, 1);
  const canvas = renderer.domElement;
  canvas.style.cssText = "position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .4s";
  box.appendChild(canvas);

  const scene = new THREE.Scene();
  // soft studio reflections for the black blocks: a small room of light panels, prefiltered once
  const pmrem = new THREE.PMREMGenerator(renderer);
  const room = new THREE.Scene();
  room.add(new THREE.Mesh(new THREE.BoxGeometry(10, 10, 10), new THREE.MeshBasicMaterial({ color: 0x202020, side: THREE.BackSide })));
  for (const [x, y, z, s, k] of [[0, 4.9, 0, 6, 3], [-4.9, 1, 1, 3, 1.5], [4.9, 2, -2, 3, 1], [0, 1, 4.9, 4, 0.8]]) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(s, s), new THREE.MeshBasicMaterial({ color: new THREE.Color(k, k, k), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); room.add(m);
  }
  scene.environment = pmrem.fromScene(room, 0.04).texture;
  scene.environmentIntensity = CFG.reflections;
  pmrem.dispose();
  const sun = new THREE.DirectionalLight(0xffffff, 1.2);
  sun.position.set(0.4, 1, 0.6);
  scene.add(sun);

  const mats = [
    new THREE.MeshStandardMaterial(CFG.block),
    new THREE.MeshStandardMaterial(CFG.tube),
  ];
  // the motion
  const P = C.nf - 1;
  const tv = new Float32Array(3), qv = new Float32Array(4);
  const pos = new THREE.Vector3(), quat = new THREE.Quaternion(), one = new THREE.Vector3(1, 1, 1), M = new THREE.Matrix4();
  function matAt(i, f) {
    const t = C.tracks[i];
    t.ct = hermite(t.tf, t.T, t.TD, 3, f, t.ct, tv);
    t.cr = hermite(t.rf, t.R, t.RD, 4, f, t.cr, qv);
    pos.set(tv[0], tv[1], tv[2]);
    quat.set(qv[0], qv[1], qv[2], qv[3]).normalize();
    return M.compose(pos, quat, one);
  }

  // the C's real extent over the whole loop (every square's corners, every 4th frame): for framing and the tilt
  const ext = new THREE.Box3(), local = new THREE.Box3(), corner = new THREE.Vector3();
  for (const p of C.parts) local.union(new THREE.Box3().setFromArray(p.pos));
  for (let f = 0; f < P; f += 4) for (let i = 0; i < C.n; i++) {
    matAt(i, f);
    for (let k = 0; k < 8; k++) {
      corner.set(k & 1 ? local.max.x : local.min.x, k & 2 ? local.max.y : local.min.y, k & 4 ? local.max.z : local.min.z);
      ext.expandByPoint(corner.applyMatrix4(M));
    }
  }
  const mid = ext.getCenter(new THREE.Vector3()), size = ext.getSize(new THREE.Vector3());
  const cx = mid.x, cy = mid.y, cz = mid.z, radius = size.length() / 2;
  // how far the C reaches across (x) and up/down the screen (z) from its centre, untilted and through the tilt
  const reach = { x: 0, z: 0 }, e = new THREE.Euler(), v = new THREE.Vector3();
  for (const k of CFG.tilt ? [0, 0.25, 0.5, 0.75, 1] : [0]) {
    if (CFG.tilt) e.set(CFG.tilt.x * Math.PI / 180 * k, CFG.tilt.y * Math.PI / 180 * k, 0);
    for (let c = 0; c < 8; c++) {
      v.set(c & 1 ? 1 : -1, c & 2 ? 1 : -1, c & 4 ? 1 : -1).multiply(size).multiplyScalar(0.5).applyEuler(e);
      reach.x = Math.max(reach.x, Math.abs(v.x)); reach.z = Math.max(reach.z, Math.abs(v.z));
    }
  }

  const pivot = new THREE.Group();                 // the tilt turns the C round its own centre
  pivot.position.set(cx, cy, cz);
  scene.add(pivot);
  const meshes = C.parts.map((p) => {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(p.pos, 3));
    g.setAttribute("normal", new THREE.BufferAttribute(p.nor, 3));
    g.setIndex(new THREE.BufferAttribute(p.idx, 1));
    const m = new THREE.InstancedMesh(g, mats[p.mat] || mats[0], C.n);
    m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    m.frustumCulled = false;
    m.position.set(-cx, -cy, -cz);
    pivot.add(m);
    return m;
  });

  // camera: Houdini's if the file has one, else straight down from the top (+Z pointing down the screen)
  const useCam = CFG.view !== "top" && C.camType !== 0;
  let camera;
  const camMat = new THREE.Matrix4().fromArray(C.camM);
  const ortho = useCam ? C.camType === 2 : CFG.projection === "orthographic";
  if (ortho) camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 1000);
  else camera = new THREE.PerspectiveCamera(30, 1, 0.01, 1000);
  if (useCam) {
    const p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3();
    camMat.decompose(p, q, s);
    camera.position.copy(p); camera.quaternion.copy(q);
    const dist = p.distanceTo(mid);
    camera.near = Math.max(dist - 3 * radius, dist / 100); camera.far = dist + 3 * radius;
  }
  function frame(w, h) {
    const aspect = w / h;
    if (useCam && C.camType === 2) {
      const hh = Math.max(C.camHW[1], C.camHW[0] / aspect) / CFG.zoom;
      Object.assign(camera, { top: hh, bottom: -hh, left: -hh * aspect, right: hh * aspect });
    } else if (useCam) {
      camera.fov = 2 * Math.atan(Math.max(C.camHW[1], C.camHW[0] / aspect) / CFG.zoom) * 180 / Math.PI;
    } else if (ortho) {
      // flat top view: the C's extent, at every amount of tilt, fitted to the box
      const hh = Math.max(reach.z, reach.x / aspect) * 1.03 / CFG.zoom;
      Object.assign(camera, { top: hh, bottom: -hh, left: -hh * aspect, right: hh * aspect });
      const D = 2 * radius + 1;
      camera.near = 0.01; camera.far = D + 2 * radius;
      camera.position.set(cx, cy + D, cz); camera.up.set(0, 0, -1); camera.lookAt(cx, cy, cz);
    } else {
      // the nearest distance at which every corner of the C's extent fits the box (with room for the tilt)
      const tv = Math.tan(Math.PI / 12) * CFG.zoom, th = tv * aspect, margin = CFG.tilt ? 1.1 : 1.03;
      const hx = size.x / 2 * margin, hy = size.y / 2, hz = size.z / 2 * margin;
      const D = hy + Math.max(hx / th, hz / tv);
      camera.fov = 30; camera.near = Math.max(D / 1000, (D - 2 * hy) / 2); camera.far = D + 2 * radius;
      camera.position.set(cx, cy + D, cz); camera.up.set(0, 0, -1); camera.lookAt(cx, cy, cz);
    }
    camera.aspect = aspect;
    camera.updateProjectionMatrix();
  }

  function pose(f) {
    for (let i = 0; i < C.n; i++) {
      matAt(i, f);
      for (const m of meshes) m.setMatrixAt(i, M);
    }
    for (const m of meshes) m.instanceMatrix.needsUpdate = true;
  }
  box.__c3d = { pose, C, meshes };                 // handy for checking the motion in the console

  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let clock = 0, last = 0, running = false, shown = false;

  // the scroll tilt (eased), from when the box's top enters the screen
  const deg = Math.PI / 180;
  function tilt() {
    if (!CFG.tilt || still) return;
    const r = box.getBoundingClientRect();
    let k = Math.min(1, Math.max(0, (innerHeight - r.top) / CFG.tilt.over));
    k = k * k * (3 - 2 * k);
    pivot.rotation.set(CFG.tilt.x * deg * k, CFG.tilt.y * deg * k, 0);
  }

  function resize() {
    const w = Math.max(1, box.clientWidth), h = Math.max(1, box.clientHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, CFG.maxPixelRatio));
    renderer.setSize(w, h, false);
    frame(w, h);
  }
  new ResizeObserver(() => { resize(); if (!running) draw(); }).observe(box);
  addEventListener("scroll", () => { tilt(); if (!running) draw(); }, { passive: true });
  resize();

  function draw() {
    pose(((clock * C.fps * CFG.speed) % P + P) % P);
    tilt();
    renderer.render(scene, camera);
    if (!shown) {
      shown = true;
      canvas.style.opacity = "1";
      const img = box.querySelector(".c3d-poster");
      if (img) img.style.opacity = "0";
    }
  }
  function loop(now) {
    if (last) clock += Math.min(0.1, (now - last) / 1000);   // no jump after a pause
    last = now;
    draw();
  }
  function play(on) {
    if (still) { draw(); return; }
    if (on === running) return;
    running = on; last = 0;
    renderer.setAnimationLoop(on ? loop : null);
  }
  new IntersectionObserver((es) => play(es[es.length - 1].isIntersecting)).observe(box);
  draw();
}
</script>
<!--
  Hosting c_web.bin (Webflow's Assets panel doesn't take .bin or .glb files):
  - jsDelivr from a GitHub repo (free, compressed, cached worldwide): push c_web.bin to a public repo, then use
    https://cdn.jsdelivr.net/gh/USER/REPO@COMMIT/c_web.bin  (pin the commit so updates never serve a stale copy)
  - or your studio's own hosting/CDN, with CORS allowed for the site's domain
  - or rename it c_web.txt and upload it to Webflow Assets (an unofficial workaround; check it loads on the published site)
-->

</div>
<div class="after"></div>
</body>
</html>
