<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C test</title>
<style>
  body { margin: 0; background: #10100E; color: #9a9a9a; font: 15px/1.5 system-ui, sans-serif; }
  .note { min-height: 60vh; display: flex; align-items: flex-end; justify-content: center; padding: 0 16px 40px; text-align: center; }
  .after { height: 60vh; }
</style>
</head>
<body>
<div class="note">Test page for the 3D C. Scroll down: it becomes the line, then the grid wall. Scroll back up for the C.</div>
<!--
  The 3D C for Webflow, played from c_web.bin (made by export_c_web.py in Houdini) with three.js.
  In Webflow: add a Code Embed where the C goes and paste all of this into it.

  What it does: the C turns on its own forever, its tubes lighting up and going out in the sweep. Scrolling down
  through the section bends it into the line and then spreads it into the grid wall; scrolling back up brings it back
  to the turning C. The C stays pinned on screen while you scroll through the section (its height sets how long the
  scroll is: 300vh below).

  Light on purpose: nothing loads until the section is about to scroll into view; three.js comes from a CDN only then;
  all 60 squares are drawn in 2 draw calls; it only draws while on screen; the pixel ratio is capped at 2; works on
  WebGL, so every current browser shows it. Visitors who ask for reduced motion get a still C (scrolling still works).
  Put the URL of c_web.bin in data-src below.
-->
<div class="c3d-track" style="position:relative;height:300vh">
  <div class="c3d" data-src="c_web.bin" data-poster=""
       style="position:sticky;top:0;width:100%;height:100vh;overflow:hidden"></div>
</div>

<script type="module">
const CFG = {
  three: "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  // the look, from your Arnold renders: shading spheres ("matcaps") rendered in Maya through your ACES view, next to
  // c_web.bin. c_tube.png holds the glass at `levels` steps from off to fully lit
  look: { block: "c_block.webp", tube: "c_tube.webp", levels: 8 },
  glow: 1.0,                 // a fully lit tube: 1 = the yellow of the Arnold render (lower is dimmer AND greener: ACES)
  // the blocks' noise (like the noise in the C material, stuck to each block as it moves; each block its own):
  // amount = contrast of the noise, lift = how much it brightens the darkest faces, scale = noise cells per unit
  grain: { amount: 0.25, lift: 0.002, scale: 72 },
  // the glass when it's off: how see-through it is facing you (Arnold's transmission 0.75), and how quickly it turns
  // into reflection toward its edges (higher = thinner reflective rim)
  glass: { clear: 0.75, edge: 3.0 },
  // each square shading the one below it: how dark right next to the square above, how far that reaches from its edge,
  // and how fast it fades as the gap between them grows (both as shares of the square's half size)
  shadow: { strength: 0.9, reach: 0.6, depth: 1.5 },
  // a lit tube's light on the face of its own square (Arnold's emission lighting the block): colour at the edge, and
  // how far in it reaches (as a share of the square's half size)
  spill: { color: [0.12, 0.19, 0.0], reach: 0.07, amount: 0.35 },   // amount: 1 = as in the Arnold render
  background: null,          // null = see-through (the section shows behind; your render's background is #10100E)
  // one fixed top orthographic camera, framed like the Maya camera "top": its centre (x, z) and ortho width.
  // null = fit the squares themselves
  camera: { x: 2.4152, z: -0.8530, width: 22.2597 },
  zoom: 1.0,                 // > 1 fills more of the screen
  maxPixelRatio: 2,
  // the sweep (as in Maya, in frames of its 288-frame loop at 24 fps): one tube after another from the C's top tip,
  // each fading up over `ramp` frames, all held, then one after another fading out the same way
  sweep: { loop: 288, inStart: 20, inStep: 1.8, outStart: 210, outStep: 1.0, ramp: 16, reverse: false },
  // the scroll, as shares of the section: the C keeps turning for `hold`, then eases into the line over `blend`; the
  // rest of the section plays the line and the grid wall. `smooth`: seconds it takes to catch up with the scroll
  scroll: { hold: 0.05, blend: 0.1, smooth: 0.15 },
};

document.querySelectorAll(".c3d[data-src]").forEach((box) => {
  const poster = box.dataset.poster;
  if (poster) {
    const img = new Image();
    img.src = poster; img.alt = ""; img.decoding = "async"; img.className = "c3d-poster";
    img.style.cssText = "position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .4s";
    box.appendChild(img);
  }
  const io = new IntersectionObserver((es) => {
    if (es.some((e) => e.isIntersecting)) { io.disconnect(); start(box).catch((e) => console.warn("[c3d]", e)); }
  }, { rootMargin: "300px" });
  io.observe(box);
});

// ------------------------------------------------------------------ the file
function parse(buf) {
  const dv = new DataView(buf);
  let o = 0;
  const pad = () => { o = (o + 3) & ~3; };
  const u32 = () => { const v = dv.getUint32(o, true); o += 4; return v; };
  const f32s = (k) => { const a = []; for (let i = 0; i < k; i++) { a.push(dv.getFloat32(o, true)); o += 4; } return a; };
  const arr = (T, k) => { const a = new T(buf.slice(o, o + k * T.BYTES_PER_ELEMENT)); o += k * T.BYTES_PER_ELEMENT; pad(); return a; };
  if (String.fromCharCode(...new Uint8Array(buf, 0, 4)) !== "CWEB") throw new Error("not a c_web.bin file");
  o = 4;
  const version = u32();
  if (version !== 4) throw new Error("c_web.bin version " + version + "; re-export with the latest export_c_web.py");
  const n = dv.getUint16(o, true), nParts = dv.getUint16(o + 2, true); o += 4;
  const nClips = u32(), fps = f32s(1)[0];
  const gq = f32s(6), sym = f32s(4);
  const cams = [];
  for (let k = 0; k < 2; k++) { const has = u32(), v = f32s(5); cams.push(has ? { x: v[0], y: v[1], z: v[2], hw: v[3], hh: v[4] } : null); }
  const parts = [];
  for (let p = 0; p < nParts; p++) {
    const mat = u32(), nv = u32(), ni = u32();
    const qp = arr(Uint16Array, nv * 3), qn = arr(Int8Array, nv * 4), idx = arr(Uint16Array, ni);
    const pos = new Float32Array(nv * 3), nor = new Float32Array(nv * 3);
    for (let v = 0; v < nv; v++) for (let a = 0; a < 3; a++) {
      pos[v * 3 + a] = gq[a] + qp[v * 3 + a] * gq[3 + a];
      nor[v * 3 + a] = qn[v * 4 + a] / 127;
    }
    parts.push({ mat, pos, nor, idx });
  }
  const clips = [];
  for (let c = 0; c < nClips; c++) {
    const nf = u32(), q = f32s(10);              // translation min (3), step (3), slope ranges (3 + 1)
    const tracks = [];
    for (let i = 0; i < n; i++) {
      const nt = u32(), nr = u32(), nc = u32();
      const tf = arr(Uint16Array, nt), tv = arr(Uint16Array, nt * 3), td = arr(Int16Array, nt * 3);
      const rf = arr(Uint16Array, nr), rv = arr(Int16Array, nr * 4), rd = arr(Int16Array, nr * 4);
      const cs = arr(Uint16Array, nc);
      const T = new Float32Array(nt * 3), TD = new Float32Array(nt * 3), R = new Float32Array(nr * 4), RD = new Float32Array(nr * 4);
      for (let k = 0; k < nt * 3; k++) { const a = k % 3; T[k] = q[a] + tv[k] * q[3 + a]; TD[k] = td[k] / 32767 * q[6 + a]; }
      for (let k = 0; k < nr * 4; k++) { R[k] = rv[k] / 32767; RD[k] = rd[k] / 32767 * q[9]; }
      const cut = new Uint8Array(nf);
      for (const f of cs) cut[f] = 1;
      tracks.push({ tf, T, TD, rf, R, RD, cut, ct: 0, cr: 0 });
    }
    clips.push({ nf, tracks });
  }
  return { n, fps, sym, cams, parts, loop: clips[0], scroll: clips[1] };
}

// a track's curve at frame f (Hermite: each key has its value and slope); across a cut it holds, then jumps
function hermite(frames, V, D, dim, f, cur, cut, out) {
  let j = cur;
  if (f < frames[j] || j > frames.length - 2) j = 0;
  while (j < frames.length - 2 && frames[j + 1] <= f) j++;
  const f0 = frames[j], h = frames[j + 1] - f0, i0 = j * dim, i1 = i0 + dim;
  if (cut[f0] && h === 1) { for (let k = 0; k < dim; k++) out[k] = V[i0 + k]; return j; }
  const u = (f - f0) / h, u2 = u * u, u3 = u2 * u;
  const a = 2 * u3 - 3 * u2 + 1, b = (u3 - 2 * u2 + u) * h, c = -2 * u3 + 3 * u2, d = (u3 - u2) * h;
  for (let k = 0; k < dim; k++) out[k] = a * V[i0 + k] + b * D[i0 + k] + c * V[i1 + k] + d * D[i1 + k];
  return j;
}
const smoothstep = (x) => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };

// ------------------------------------------------------------------ the scene
async function start(box) {
  const [THREE, data] = await Promise.all([
    import(CFG.three),
    fetch(box.dataset.src).then((r) => { if (!r.ok) throw new Error("c_web.bin: HTTP " + r.status); return r.arrayBuffer(); }),
  ]);
  const C = parse(data);
  const track = box.closest(".c3d-track") || box;

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: CFG.background === null, powerPreference: "high-performance" });
  } catch (e) { console.warn("[c3d] no WebGL, keeping the poster"); return; }
  if (CFG.background !== null) renderer.setClearColor(CFG.background, 1);
  const canvas = renderer.domElement;
  canvas.style.cssText = "position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .4s";
  box.appendChild(canvas);

  const scene = new THREE.Scene();
  const base = new URL(box.dataset.src, location.href);
  const loader = new THREE.TextureLoader();
  const tex = (name) => new Promise((ok, no) => loader.load(new URL(name, base).href, (t) => {
    t.colorSpace = THREE.SRGBColorSpace; t.generateMipmaps = false; t.minFilter = THREE.LinearFilter; ok(t);
  }, undefined, no));
  const [blockTex, tubeTex] = await Promise.all([tex(CFG.look.block), tex(CFG.look.tube)]);

  // the square's own frame (from the block's geometry): its thickness axis, two in-plane edge directions, half size
  const blk = C.parts.find((p) => p.mat === 0) || C.parts[0];
  const nAx = new THREE.Vector3(C.sym[0], C.sym[1], C.sym[2]).normalize();
  let uAx = null, best = 0;
  for (let k = 0; k < blk.nor.length; k += 3) {
    const v = new THREE.Vector3(blk.nor[k], blk.nor[k + 1], blk.nor[k + 2]);
    if (Math.abs(v.dot(nAx)) > 0.1) continue;
    v.addScaledVector(nAx, -v.dot(nAx)).normalize();
    let votes = 0;
    for (let j = 0; j < blk.nor.length; j += 3) {
      const w = new THREE.Vector3(blk.nor[j], blk.nor[j + 1], blk.nor[j + 2]);
      if (Math.abs(w.dot(nAx)) < 0.1 && Math.abs(Math.abs(w.dot(v)) - 1) < 0.02) votes++;
    }
    if (votes > best) { best = votes; uAx = v; }
  }
  if (!uAx) uAx = new THREE.Vector3(1, 0, 0).cross(nAx).normalize();
  const vAx = new THREE.Vector3().crossVectors(nAx, uAx).normalize();
  let half = 0, thick = 0;
  for (let k = 0; k < blk.pos.length; k += 3) {
    const p = new THREE.Vector3(blk.pos[k], blk.pos[k + 1], blk.pos[k + 2]);
    half = Math.max(half, Math.abs(p.dot(uAx)), Math.abs(p.dot(vAx)));
    thick = Math.max(thick, Math.abs(p.dot(nAx)));
  }
  // the tube's corner rounding (from its own shape), so the glow and the shading round the corners the same way
  let rTube = 0.1 * half;
  const tub = C.parts.find((p) => p.mat === 1);
  if (tub) {
    let ax = 0, dg = 0;
    for (let k = 0; k < tub.pos.length; k += 3) {
      const p = new THREE.Vector3(tub.pos[k], tub.pos[k + 1], tub.pos[k + 2]), a = Math.abs(p.dot(uAx)), b = Math.abs(p.dot(vAx));
      ax = Math.max(ax, a, b); dg = Math.max(dg, (a + b) / Math.SQRT2);
    }
    rTube = Math.min(Math.max((ax * Math.SQRT2 - dg) / (Math.SQRT2 - 1), 0), half);
  }
  const rGlow = Math.max(rTube, 3 * CFG.spill.reach * half), rShade = Math.max(rTube, 0.5 * CFG.shadow.reach * half);

  // matcap shading, read straight down (orthographic), with a per-square glow (the sweep)
  const ORTHO = "vec3 viewDir = vec3( 0.0, 0.0, 1.0 );";
  const withGlow = (sh, local) => {
    sh.vertexShader = "attribute float aGlow;\nvarying float vGlow;\n" + (local ? "varying vec3 vLocal, vLocalN;\n" : "") +
      sh.vertexShader.replace("#include <begin_vertex>", "#include <begin_vertex>\nvGlow = aGlow;" + (local ? "\nvLocal = position; vLocalN = normal;" : ""));
    sh.fragmentShader = "varying float vGlow;\n" + (local ? "varying vec3 vLocal, vLocalN;\n" : "") +
      sh.fragmentShader.replace("vec3 viewDir = normalize( vViewPosition );", ORTHO);
  };
  const blockMat = new THREE.MeshMatcapMaterial({ matcap: blockTex });
  blockMat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, { uGrain: { value: new THREE.Vector3(CFG.grain.amount, CFG.grain.lift, CFG.grain.scale) },
      uShadow: { value: new THREE.Vector3(CFG.shadow.strength, CFG.shadow.reach * half, CFG.shadow.depth * half) },
      uThick: { value: thick }, uRound: { value: new THREE.Vector2(rGlow, rShade) } });
    Object.assign(sh.uniforms, { uU: { value: uAx }, uV: { value: vAx }, uN: { value: nAx }, uHalf: { value: half },
      uSpill: { value: new THREE.Color().fromArray(CFG.spill.color).multiplyScalar(CFG.spill.amount) }, uReach: { value: CFG.spill.reach * half } });
    withGlow(sh, true);
    sh.vertexShader = "varying float vInst;\nattribute vec4 aOccA, aOccB, aOccC, aOccD;\nvarying vec3 vOccL;\n" +
      sh.vertexShader.replace("vGlow = aGlow;", "vGlow = aGlow;\nvInst = float( gl_InstanceID );\n" +
        "vOccL = ( mat4( aOccA, aOccB, aOccC, aOccD ) * ( instanceMatrix * vec4( position, 1.0 ) ) ).xyz;");
    sh.fragmentShader = "uniform vec3 uU, uV, uN, uSpill, uGrain, uShadow;\nuniform float uHalf, uReach, uThick;\nuniform vec2 uRound;\nvarying float vInst;\nvarying vec3 vOccL;\n" +
      "float rsq( vec2 p, float a, float r ) { vec2 q = abs( p ) - vec2( a - r ); return length( max( q, 0.0 ) ) + min( max( q.x, q.y ), 0.0 ) - r; }\n" +
      "float h3( vec3 p ) { p = fract( p * 0.3183099 + 0.1 ); p *= 17.0; return fract( p.x * p.y * p.z * ( p.x + p.y + p.z ) ); }\n" +
      "float vn( vec3 x ) { vec3 i = floor( x ), f = fract( x ); f = f * f * ( 3.0 - 2.0 * f );\n" +
      "  return mix( mix( mix( h3( i ), h3( i + vec3( 1, 0, 0 ) ), f.x ), mix( h3( i + vec3( 0, 1, 0 ) ), h3( i + vec3( 1, 1, 0 ) ), f.x ), f.y ),\n" +
      "              mix( mix( h3( i + vec3( 0, 0, 1 ) ), h3( i + vec3( 1, 0, 1 ) ), f.x ), mix( h3( i + vec3( 0, 1, 1 ) ), h3( i + vec3( 1, 1, 1 ) ), f.x ), f.y ), f.z ); }\n" +
      sh.fragmentShader.replace(
      "vec3 outgoingLight = diffuseColor.rgb * matcapColor.rgb;",
      "vec3 outgoingLight = diffuseColor.rgb * matcapColor.rgb;\n" +
      "vec3 gp = vLocal * uGrain.z + vInst * 7.13;\n" +
      "float gn = 0.65 * vn( gp ) + 0.35 * vn( gp * 2.3 + 11.7 );\n" +
      "outgoingLight = outgoingLight * ( 1.0 + uGrain.x * ( 2.0 * gn - 1.0 ) ) + uGrain.y * gn;\n" +
      "float od = rsq( vec2( dot( vOccL, uU ), dot( vOccL, uV ) ), uHalf, uRound.y );\n" +
      "float oh = max( abs( dot( vOccL, uN ) ) - uThick, 0.0 );\n" +
      "outgoingLight *= 1.0 - uShadow.x * exp( - max( od, 0.0 ) / uShadow.y ) * exp( - oh / uShadow.z );\n" +
      "float edge = - rsq( vec2( dot( vLocal, uU ), dot( vLocal, uV ) ), uHalf, uRound.x );\n" +
      "float face = smoothstep( 0.6, 0.9, abs( dot( normalize( vLocalN ), uN ) ) );\n" +
      "outgoingLight += vGlow * face * uSpill * exp( - max( edge, 0.0 ) / uReach );");
  };
  // the glass: its reflections added on top, what's behind showing through (less toward its edges); lit, it's solid
  const tubeMat = new THREE.MeshMatcapMaterial({ matcap: tubeTex, transparent: true, depthWrite: false,
    blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
    blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneMinusSrcAlphaFactor });
  tubeMat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, { uLevels: { value: CFG.look.levels }, uGlass: { value: new THREE.Vector3(CFG.glass.clear, CFG.glass.edge, Math.max(CFG.glow, 1e-3)) } });
    withGlow(sh, false);
    sh.fragmentShader = "uniform float uLevels;\nuniform vec3 uGlass;\n" + sh.fragmentShader.replace(
      "vec3 outgoingLight = diffuseColor.rgb * matcapColor.rgb;",
      "vec3 outgoingLight = diffuseColor.rgb * matcapColor.rgb;\n" +
      "float ndv = clamp( abs( normal.z ), 0.0, 1.0 );\n" +
      "diffuseColor.a = max( mix( 1.0 - uGlass.x, 1.0, pow( 1.0 - ndv, uGlass.y ) ), clamp( vGlow, 0.0, 1.0 ) );").replace(
      "vec4 matcapColor = texture2D( matcap, uv );",
      "float lv = clamp( vGlow * uGlass.z, 0.0, 1.0 ) * ( uLevels - 1.0 ), l0 = min( floor( lv ), uLevels - 2.0 );\n" +
      "vec4 matcapColor = mix( texture2D( matcap, vec2( ( l0 + uv.x ) / uLevels, uv.y ) ),\n" +
      "                        texture2D( matcap, vec2( ( l0 + 1.0 + uv.x ) / uLevels, uv.y ) ), lv - l0 );");
  };
  const mats = [blockMat, tubeMat];
  const glow = new THREE.InstancedBufferAttribute(new Float32Array(C.n), 1);
  glow.setUsage(THREE.DynamicDrawUsage);
  // for the shading: every square gets the inverse transform of the square above it
  const occ = [0, 1, 2, 3].map(() => { const a = new THREE.InstancedBufferAttribute(new Float32Array(C.n * 4), 4); a.setUsage(THREE.DynamicDrawUsage); return a; });
  const meshes = C.parts.map((p) => {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(p.pos, 3));
    g.setAttribute("normal", new THREE.BufferAttribute(p.nor, 3));
    g.setIndex(new THREE.BufferAttribute(p.idx, 1));
    g.setAttribute("aGlow", glow);
    if (p.mat === 0) ["aOccA", "aOccB", "aOccC", "aOccD"].forEach((nm, k) => g.setAttribute(nm, occ[k]));
    const m = new THREE.InstancedMesh(g, mats[p.mat] || mats[0], C.n);
    m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    m.frustumCulled = false;
    scene.add(m);
    if (p.mat === 1) {
      // the glass's depth first (no colour), so only its front surface is drawn: where a tube's surface folds over itself
      // in a tight corner, it would otherwise be added twice and show as a bright notch
      const d = new THREE.InstancedMesh(g, new THREE.MeshBasicMaterial({ colorWrite: false }), C.n);
      d.instanceMatrix = m.instanceMatrix;
      d.frustumCulled = false;
      d.renderOrder = 1;
      scene.add(d);
    }
    return m;
  });

  // ---- the motion: the loop (time) and the scroll, blended through the square's quarter-turn symmetry
  const tv = new Float32Array(3), qv = new Float32Array(4);
  const pA = new THREE.Vector3(), qA = new THREE.Quaternion(), pB = new THREE.Vector3(), qB = new THREE.Quaternion();
  const one = new THREE.Vector3(1, 1, 1), M = new THREE.Matrix4();
  const symAxis = new THREE.Vector3(C.sym[0], C.sym[1], C.sym[2]).normalize();
  const quarter = [0, 1, 2, 3].map((k) => new THREE.Quaternion().setFromAxisAngle(symAxis, k * Math.PI / 2));
  const qTry = new THREE.Quaternion();
  function at(clip, i, f, p, q) {
    const t = clip.tracks[i];
    t.ct = hermite(t.tf, t.T, t.TD, 3, f, t.ct, t.cut, tv);
    t.cr = hermite(t.rf, t.R, t.RD, 4, f, t.cr, t.cut, qv);
    p.set(tv[0], tv[1], tv[2]);
    q.set(qv[0], qv[1], qv[2], qv[3]).normalize();
  }
  function matAt(i, fLoop, fScroll, w) {
    if (w <= 0) at(C.loop, i, fLoop, pA, qA);
    else if (w >= 1) at(C.scroll, i, fScroll, pA, qA);
    else {
      at(C.loop, i, fLoop, pA, qA);
      at(C.scroll, i, fScroll, pB, qB);
      let best = -1, bk = 0;                     // the quarter turn of the loop's square closest to the scroll's
      for (let k = 0; k < 4; k++) { const d = Math.abs(qTry.copy(qA).multiply(quarter[k]).dot(qB)); if (d > best) { best = d; bk = k; } }
      qA.multiply(quarter[bk]).slerp(qB, w);
      pA.lerp(pB, w);
    }
    return M.compose(pA, qA, one);
  }

  // ---- the sweep (Maya's level(i, f, n))
  const S = CFG.sweep;
  function level(i, f) {
    const k = S.reverse ? C.n - 1 - i : i;
    const a = S.inStart + S.inStep * k, b = S.outStart + S.outStep * k;
    return smoothstep((f - a) / S.ramp) * (1 - smoothstep((f - b) / S.ramp));
  }

  // ---- framing: one top orthographic camera (CFG.camera), or the squares' own extent without it
  const local = new THREE.Box3();
  for (const p of C.parts) local.union(new THREE.Box3().setFromArray(p.pos));
  const corner = new THREE.Vector3();
  function extent(clip, f0, f1, step) {
    const b = new THREE.Box3();
    for (let f = f0; f <= f1; f += step) for (let i = 0; i < C.n; i++) {
      at(clip, i, f, pA, qA); M.compose(pA, qA, one);
      for (let k = 0; k < 8; k++) {
        corner.set(k & 1 ? local.max.x : local.min.x, k & 2 ? local.max.y : local.min.y, k & 4 ? local.max.z : local.min.z);
        b.expandByPoint(corner.applyMatrix4(M));
      }
    }
    const c = b.getCenter(new THREE.Vector3()), s = b.getSize(new THREE.Vector3());
    return { x: c.x, y: c.y, z: c.z, hw: s.x / 2 * 1.03, hh: s.z / 2 * 1.03, top: b.max.y, bottom: b.min.y };
  }
  const PL = C.loop.nf - 1, PS = C.scroll.nf - 1;
  const eL = extent(C.loop, 0, PL - 1, 4), eS = extent(C.scroll, Math.max(0, PS - 24), PS, 4);
  const fixed = CFG.camera ? { x: CFG.camera.x, z: CFG.camera.z, hw: CFG.camera.width / 2, hh: CFG.camera.width / 2 } : null;
  const camA = fixed || eL, camB = fixed || eS;
  const top = Math.max(eL.top, eS.top) + 10, depth = top - Math.min(eL.bottom, eS.bottom) + 10;
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, depth);
  camera.up.set(0, 0, -1);
  let aspect = 1;
  function frame(g) {
    const x = camA.x + (camB.x - camA.x) * g, z = camA.z + (camB.z - camA.z) * g;
    const hw = camA.hw + (camB.hw - camA.hw) * g, hh0 = camA.hh + (camB.hh - camA.hh) * g;
    const hh = Math.max(hh0, hw / aspect) / CFG.zoom;
    Object.assign(camera, { top: hh, bottom: -hh, left: -hh * aspect, right: hh * aspect });
    camera.position.set(x, top, z); camera.lookAt(x, top - 1, z);
    camera.updateProjectionMatrix();
  }

  // ---- state
  const inst = Array.from({ length: C.n }, () => new THREE.Matrix4()), INV = new THREE.Matrix4();
  const FAR = new THREE.Matrix4().makeTranslation(1e4, 1e4, 1e4);   // "nothing above": far away
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let clock = 0, last = 0, running = false, shown = false, sNow = progress(), forceGlow = null;
  function progress() {
    const r = track.getBoundingClientRect(), span = r.height - innerHeight;
    return span > 0 ? Math.min(1, Math.max(0, -r.top / span)) : 0;
  }
  function draw() {
    const fLoop = still ? 0 : (clock * C.fps) % PL;
    const fSweep = (clock * C.fps) % S.loop;
    const u = Math.min(1, Math.max(0, (sNow - CFG.scroll.hold) / (1 - CFG.scroll.hold)));
    const w = smoothstep(u * (1 - CFG.scroll.hold) / CFG.scroll.blend);
    const fScroll = u * PS;
    for (let i = 0; i < C.n; i++) {
      matAt(i, fLoop, fScroll, w);
      for (const m of meshes) m.setMatrixAt(i, M);
      inst[i].copy(M);
      glow.array[i] = forceGlow !== null ? forceGlow : still ? 0 : level(i, fSweep);
    }
    for (let i = 0; i < C.n; i++) {                // the square above each square (the neighbour sitting higher)
      const y = inst[i].elements[13];
      const a = i + 1 < C.n && inst[i + 1].elements[13] > y ? i + 1 : i > 0 && inst[i - 1].elements[13] > y ? i - 1 : -1;
      const e = a < 0 ? FAR.elements : INV.copy(inst[a]).invert().elements;
      for (let k = 0; k < 4; k++) occ[k].array.set(e.slice(k * 4, k * 4 + 4), i * 4);
    }
    for (const m of meshes) m.instanceMatrix.needsUpdate = true;
    glow.needsUpdate = true;
    for (const a of occ) a.needsUpdate = true;
    frame(smoothstep(u / 0.35));
    renderer.render(scene, camera);
    if (!shown) {
      shown = true;
      canvas.style.opacity = "1";
      const img = box.querySelector(".c3d-poster");
      if (img) img.style.opacity = "0";
    }
  }
  // for checking it in the console: set(scroll 0..1, seconds) shows that moment; pause() stops the clock;
  // lightAll(0..1) lights every tube that much (lightAll(null) goes back to the sweep)
  box.__c3d = { C, meshes, glow, draw, set: (s, t) => { sNow = s; if (t !== undefined) clock = t; draw(); },
    pause: () => { running = true; renderer.setAnimationLoop(null); }, lightAll: (g) => { forceGlow = g; draw(); } };

  function loop(now) {
    const dt = last ? Math.min(0.1, (now - last) / 1000) : 0;   // no jump after a pause
    last = now;
    if (!still) clock += dt;
    const d = progress() - sNow;
    sNow += CFG.scroll.smooth > 0 ? d * (1 - Math.exp(-dt / CFG.scroll.smooth)) : d;
    if (still && Math.abs(d) < 1e-4) return;
    draw();
  }
  function resize() {
    const w = Math.max(1, box.clientWidth), h = Math.max(1, box.clientHeight);
    aspect = w / h;
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, CFG.maxPixelRatio));
    renderer.setSize(w, h, false);
  }
  new ResizeObserver(() => { resize(); draw(); }).observe(box);
  resize();
  new IntersectionObserver((es) => {
    const on = es[es.length - 1].isIntersecting;
    if (on === running) return;
    running = on; last = 0;
    renderer.setAnimationLoop(on ? loop : null);
  }).observe(box);
  draw();
}
</script>
