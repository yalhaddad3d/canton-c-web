<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>C Depth: Follow a Packet, Neon on Top</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* layout: the scroll section fills the page; a quiet control panel floats at the right (a bottom sheet on phones) */
  :root {
    --bg: #10100E;          /* the render's background */
    --panel: #181815;
    --line: #2b2b25;
    --fg: #e6e4d8;
    --muted: #8e8c7f;
    --neon: #e4e35a;        /* the lit tube */
    --neon-dim: #6f6e2c;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); }
  .intro { min-height: 55vh; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px;
    padding-block: 48px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    max-width: 62ch; }
  .intro h1 { font-size: 22px; font-weight: 500; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
  .intro p { margin: 0; color: var(--muted); }
  .c3d { cursor: crosshair; }

  .hud { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: 16px; font: 12px/1.4 var(--mono); color: var(--muted);
    pointer-events: none; display: flex; flex-direction: column; gap: 2px; }
  .hud b { color: var(--fg); font-weight: 500; }

  .panel { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); top: max(12px, env(safe-area-inset-top, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px));
    width: 300px; display: flex; flex-direction: column; background: color-mix(in srgb, var(--panel) 92%, transparent);
    border: 1px solid var(--line); border-radius: 6px; z-index: 5; backdrop-filter: blur(6px); }
  .panel header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .panel header h2 { margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .panel .body { overflow-y: auto; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 16px; }
  .panel.closed { bottom: auto; }
  .panel.closed .body { display: none; }
  button { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 5px 9px; cursor: pointer; }
  button:hover { border-color: var(--neon-dim); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }
  .presets { display: grid; gap: 6px; }
  .preset { text-align: left; display: grid; gap: 1px; padding: 8px 10px; }
  .preset .k { font: 11px var(--mono); color: var(--muted); }
  .preset .n { font-weight: 500; }
  .preset[aria-pressed="true"] { border-color: var(--neon); background: color-mix(in srgb, var(--neon) 8%, transparent); }
  .preset[aria-pressed="true"] .k { color: var(--neon); }
  .desc { color: var(--muted); font-size: 13px; margin: 0; }
  .grp { display: flex; flex-direction: column; gap: 8px; }
  .grp h3 { margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .row { display: grid; grid-template-columns: 92px 1fr 44px; align-items: center; gap: 8px; font-size: 13px; }
  .row output { font: 12px var(--mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--neon); }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .chk input { accent-color: var(--neon); }
  .jumps { display: flex; flex-wrap: wrap; gap: 6px; }
  @media (max-width: 640px) {
    .panel { left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); top: auto; width: auto; max-height: 46vh; }
    .panel.closed { max-height: none; }
  }
</style>

<div class="intro">
  <h1 id="introTitle">Grid wall depth lab</h1>
  <p id="introText">The Data Traffic page with its real blocks, tubes and motion, rebuilt so the camera can leave the top view. Round two: ideas A and B, and five new camera ideas built on them. Pick one in the panel, then scroll. The C stays orthographic in every version.</p>
</div>

<div class="c3d-track" style="position:relative;height:225vh">
  <div class="c3d" data-src="c_web.bin" style="position:sticky;top:0;width:100%;height:100vh;overflow:hidden">
    <div class="hud" id="hud"><span><b id="hudPhase">C</b></span><span id="hudCam">ortho</span></div>
  </div>
</div>

<aside class="panel" id="panel" aria-label="Depth options">
  <header>
    <h2>Depth ideas</h2>
    <button id="toggle" aria-expanded="true">Hide</button>
  </header>
  <div class="body">
    <div class="presets" id="presets"></div>
    <p class="desc" id="desc"></p>
    <div class="jumps">
      <button data-jump="0.01">C</button>
      <button data-jump="0.2">Line</button>
      <button data-jump="0.695">Grid wall</button>
      <button data-jump="0.96">Pulled back</button>
    </div>
    <div class="grp" id="controls"></div>
  </div>
</aside>

<script type="module">
// set to an idea's id ("leave", "drift", "flow", "crane", "lean", "focus", "chase") to make this page that idea alone,
// without the panel; null = the lab, with every idea and the panel
const LOCK = "chase";
// ------------------------------------------------------------------ the ideas
const BASE = { persp: 1, fov: 34, tilt: 34, yaw: 0, frame: 0.9, drift: 0, parallax: 0, key: 0.25, sheen: 0.2, spill: 0.5, ao: 0.5, fog: 0.5,
  revZoom: 1.7, revTilt: 14, revYaw: 0, field: 1, travel: 0, inertia: 0, chase: 0, dof: 0 };
const PRESETS = [
  { id: "today", key: "0", name: "Today", desc: "The page as it is: one top orthographic camera from start to end. Every square faces the camera at the same angle, so on the wall they all shade alike and read as a flat pattern.",
    v: { ...BASE, persp: 0, key: 0, sheen: 0, spill: 0, ao: 0, fog: 0, revZoom: 2.2, revTilt: 0, field: 0 } },
  { id: "leave", key: "A", name: "Leave ortho after the C", desc: "Orthographic only while it's the C. As the C starts to unbend, the camera dolly-zooms into a real lens and tips back, so the staircase depth inside the C shows through the line, and the wall recedes into the distance.",
    v: { ...BASE } },
  { id: "drift", key: "B", name: "Drift and parallax", desc: "Idea A plus a camera that never quite stops: a slow orbit and sway, and a few degrees of tilt following the cursor. Constant small parallax keeps the blocks reading as objects.",
    v: { ...BASE, tilt: 32, yaw: 12, drift: 1, parallax: 1 } },
  { id: "flow", key: "G", name: "Flow forward", desc: "Once the wall has formed, the camera keeps gliding forward over it, slowly on its own and faster as you scroll, with the wall carrying on endlessly ahead. The blocks stream toward you, so depth comes from motion: where finance flows, literally.",
    v: { ...BASE, tilt: 48, fov: 38, frame: 0.85, yaw: 8, drift: 0.5, parallax: 0.7, fog: 0.7, travel: 1 } },
  { id: "crane", key: "H", name: "Crane on the pull back", desc: "The pull back at the end becomes a crane move: while it widens, the camera swings round about 40° and rises, so the wall turns under you and its rows sweep across the frame instead of simply shrinking.",
    v: { ...BASE, drift: 0.5, parallax: 0.7, revZoom: 2.2, revTilt: 20, revYaw: 40 } },
  { id: "lean", key: "I", name: "Scroll lean", desc: "The camera responds to how you scroll: scroll down and it tips forward over the wall, stop and it springs back and settles with a slight overshoot. The wall feels like a physical surface with weight.",
    v: { ...BASE, tilt: 32, yaw: 12, drift: 0.6, parallax: 0.8, inertia: 1 } },
  { id: "focus", key: "J", name: "Tilt-shift focus", desc: "A shallow depth of field: the row in the middle of the frame is sharp and the rows nearer and further melt into blur, like a macro lens. It reads instantly as distance, and makes the blocks feel like a small, precise object.",
    v: { ...BASE, tilt: 46, fov: 30, yaw: 12, frame: 0.8, drift: 0.6, parallax: 0.8, dof: 0.7 } },
  { id: "chase", key: "K", name: "Follow a packet", desc: "Once the wall is formed, the camera drops low and rides along with one packet of light as it runs down its row, the wall streaming past on both sides. The C becomes a network you travel through rather than look at.",
    v: { ...BASE, tilt: 34, yaw: 12, fov: 40, drift: 0.4, parallax: 0.6, fog: 0.8, chase: 1, dof: 0.35 } },
];
const CONTROLS = [
  ["Camera", [
    ["persp", "Lens after C", "check"], ["fov", "Lens (fov)", 10, 70, 1, "°"], ["tilt", "Tilt", 0, 75, 1, "°"], ["yaw", "Turn", -45, 45, 1, "°"],
    ["frame", "Framing", 0.5, 1.5, 0.01, "×"], ["drift", "Drift", 0, 1, 0.01, ""], ["parallax", "Cursor", 0, 1, 0.01, ""]]],
  ["Motion", [
    ["travel", "Flow forward", 0, 2, 0.01, ""], ["inertia", "Scroll lean", 0, 1.5, 0.01, ""], ["chase", "Follow packet", 0, 1, 0.01, ""]]],
  ["Pull back", [
    ["revZoom", "Widen", 1, 3, 0.05, "×"], ["revTilt", "Tilt", -30, 30, 1, "°"], ["revYaw", "Swing", -60, 60, 1, "°"]]],
  ["Lens and look", [
    ["dof", "Focus blur", 0, 1.5, 0.01, ""], ["spill", "Tube spill", 0, 1.5, 0.01, ""], ["ao", "Contact dark", 0, 1, 0.01, ""], ["fog", "Depth fade", 0, 1.5, 0.01, ""], ["field", "Wall goes on", "check"]]],
];
const P = { ...PRESETS[1].v };   // live settings (start on idea A)
let presetId = "leave";

const CFG = {
  three: "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  look: { block: "c_block.webp", tube: "c_tube.webp", levels: 8 },
  glow: 1.0, brightness: 1.0,
  grain: { amount: 0.25, lift: 0.002, scale: 72 },
  glass: { clear: 0.75, edge: 3.0 },
  spill: { color: [0.12, 0.19, 0.0], reach: 0.07, amount: 0.2 },
  background: "#10100E",
  camera: { x: 2.4152, z: -0.8530, width: 22.2597 },
  zoom: 1.0, ends: 0.8,
  net: { rest: 0.12, restBrightness: 0.45, busy: 0.9, spacing: [2.5, 5], pace: 1, trail: 0.9 },
  connect: { width: 1.0, fadeIn: 0.08 },
  tubes: { flicker: 0.45, flickerSpeed: 1.0 },
  maxPixelRatio: 2,
  sweep: { loop: 288, inStart: 20, inStep: 1.8, outStart: 210, outStep: 1.0, ramp: 16, reverse: false },
  // the scroll, as shares of the section (225vh tall: 1.25 screens of scrolling): the C holds, eases into the line, the
  // line and the grid wall play, the camera pulls back (zoom), and it rests for `end`. smooth: seconds to catch up
  scroll: { hold: 0.035, blend: 0.07, zoom: 0.26, end: 0.05, smooth: 0.25 },
  // the wider wall around the C's 60 (columns either side, rows behind / in front)
  // the wider wall coming in: how fast it spreads out from the wall (blocks per second), over how many blocks each one
  // fades in (so each takes soft / speed seconds), and how long the camera moves (flow, follow) take to ease in (seconds)
  reveal: { speed: 2.2, soft: 5, ease: 3 },
};

// ------------------------------------------------------------------ panel
const $ = (s) => document.querySelector(s);
const presetsEl = $("#presets"), ctlEl = $("#controls"), inputs = {};
for (const p of PRESETS) {
  const b = document.createElement("button");
  b.className = "preset"; b.dataset.id = p.id; b.setAttribute("aria-pressed", "false");
  b.innerHTML = `<span class="k">${p.key === "0" ? "Baseline" : "Idea " + p.key}</span><span class="n">${p.name}</span>`;
  b.onclick = () => applyPreset(p.id);
  presetsEl.appendChild(b);
}
for (const [title, list] of CONTROLS) {
  const g = document.createElement("div"); g.className = "grp";
  g.innerHTML = `<h3>${title}</h3>`;
  for (const [k, label, a, b, step, unit] of list) {
    if (a === "check") {
      const l = document.createElement("label"); l.className = "chk";
      l.innerHTML = `<input type="checkbox" id="c-${k}"> ${label}`;
      const inp = l.querySelector("input");
      inp.onchange = () => { P[k] = inp.checked ? 1 : 0; markCustom(); };
      inputs[k] = { inp, set: (v) => { inp.checked = !!v; } };
      g.appendChild(l);
    } else {
      const r = document.createElement("div"); r.className = "row";
      r.innerHTML = `<label for="c-${k}">${label}</label><input type="range" id="c-${k}" min="${a}" max="${b}" step="${step}"><output></output>`;
      const inp = r.querySelector("input"), out = r.querySelector("output");
      const show = () => { const v = +inp.value; out.textContent = (Math.abs(v) >= 10 || step >= 1 ? Math.round(v) : v.toFixed(2)) + unit; };
      inp.oninput = () => { P[k] = +inp.value; show(); markCustom(); };
      inputs[k] = { inp, set: (v) => { inp.value = v; show(); } };
      g.appendChild(r);
    }
  }
  ctlEl.appendChild(g);
}
function syncInputs() { for (const k in inputs) inputs[k].set(P[k]); }
function applyPreset(id) {
  const p = PRESETS.find((q) => q.id === id);
  Object.assign(P, p.v); presetId = id; syncInputs();
  for (const b of presetsEl.children) b.setAttribute("aria-pressed", String(b.dataset.id === id));
  $("#desc").textContent = p.desc;
  if (!LOCK) try { localStorage.setItem("depthlab.preset2", id); } catch (e) {}
}
function markCustom() {
  for (const b of presetsEl.children) b.setAttribute("aria-pressed", "false");
  $("#desc").textContent = "Custom mix. Pick an idea above to reset.";
}
let saved = null; try { saved = localStorage.getItem("depthlab.preset2"); } catch (e) {}
if (LOCK) {
  // a page for one idea: that idea alone, no panel
  const p = PRESETS.find((q) => q.id === LOCK);
  applyPreset(LOCK);
  $("#panel").hidden = true;
  $("#introTitle").textContent = "Idea " + p.key + ": " + p.name + " (neon on top)";
  $("#introText").hidden = true;
  $("#hud").hidden = true;
} else applyPreset(PRESETS.some((p) => p.id === saved) ? saved : "drift");
$("#toggle").onclick = () => {
  const c = $("#panel").classList.toggle("closed");
  $("#toggle").textContent = c ? "Show" : "Hide"; $("#toggle").setAttribute("aria-expanded", String(!c));
};
document.querySelectorAll("[data-jump]").forEach((b) => b.onclick = () => {
  const t = $(".c3d-track");
  window.scrollTo({ top: t.offsetTop + (t.offsetHeight - innerHeight) * +b.dataset.jump, behavior: "smooth" });
});

// ------------------------------------------------------------------ the file (as on the live pages)
function parse(buf) {
  const dv = new DataView(buf);
  let o = 0;
  const pad = () => { o = (o + 3) & ~3; };
  const u32 = () => { const v = dv.getUint32(o, true); o += 4; return v; };
  const f32s = (k) => { const a = []; for (let i = 0; i < k; i++) { a.push(dv.getFloat32(o, true)); o += 4; } return a; };
  const arr = (T, k) => { const a = new T(buf.slice(o, o + k * T.BYTES_PER_ELEMENT)); o += k * T.BYTES_PER_ELEMENT; pad(); return a; };
  if (String.fromCharCode(...new Uint8Array(buf, 0, 4)) !== "CWEB") throw new Error("not a c_web.bin file");
  o = 4;
  const version = u32();
  if (version !== 4) throw new Error("c_web.bin version " + version);
  const n = dv.getUint16(o, true), nParts = dv.getUint16(o + 2, true); o += 4;
  const nClips = u32(), fps = f32s(1)[0];
  const gq = f32s(6), sym = f32s(4);
  for (let k = 0; k < 2; k++) { u32(); f32s(5); }
  const parts = [];
  for (let p = 0; p < nParts; p++) {
    const mat = u32(), nv = u32(), ni = u32();
    const qp = arr(Uint16Array, nv * 3), qn = arr(Int8Array, nv * 4), idx = arr(Uint16Array, ni);
    const pos = new Float32Array(nv * 3), nor = new Float32Array(nv * 3);
    for (let v = 0; v < nv; v++) for (let a = 0; a < 3; a++) { pos[v * 3 + a] = gq[a] + qp[v * 3 + a] * gq[3 + a]; nor[v * 3 + a] = qn[v * 4 + a] / 127; }
    parts.push({ mat, pos, nor, idx });
  }
  const clips = [];
  for (let c = 0; c < nClips; c++) {
    const nf = u32(), q = f32s(10);
    const tracks = [];
    for (let i = 0; i < n; i++) {
      const nt = u32(), nr = u32(), nc = u32();
      const tf = arr(Uint16Array, nt), tv = arr(Uint16Array, nt * 3), td = arr(Int16Array, nt * 3);
      const rf = arr(Uint16Array, nr), rv = arr(Int16Array, nr * 4), rd = arr(Int16Array, nr * 4);
      const cs = arr(Uint16Array, nc);
      const T = new Float32Array(nt * 3), TD = new Float32Array(nt * 3), R = new Float32Array(nr * 4), RD = new Float32Array(nr * 4);
      for (let k = 0; k < nt * 3; k++) { const a = k % 3; T[k] = q[a] + tv[k] * q[3 + a]; TD[k] = td[k] / 32767 * q[6 + a]; }
      for (let k = 0; k < nr * 4; k++) { R[k] = rv[k] / 32767; RD[k] = rd[k] / 32767 * q[9]; }
      const cut = new Uint8Array(nf);
      for (const f of cs) cut[f] = 1;
      tracks.push({ tf, T, TD, rf, R, RD, cut, ct: 0, cr: 0 });
    }
    clips.push({ nf, tracks });
  }
  return { n, fps, sym, parts, loop: clips[0], scroll: clips[1] };
}
function hermite(frames, V, D, dim, f, cur, cut, out) {
  let j = cur;
  if (f < frames[j] || j > frames.length - 2) j = 0;
  while (j < frames.length - 2 && frames[j + 1] <= f) j++;
  const f0 = frames[j], h = frames[j + 1] - f0, i0 = j * dim, i1 = i0 + dim;
  if (cut[f0] && h === 1) { for (let k = 0; k < dim; k++) out[k] = V[i0 + k]; return j; }
  const u = (f - f0) / h, u2 = u * u, u3 = u2 * u;
  const a = 2 * u3 - 3 * u2 + 1, b = (u3 - 2 * u2 + u) * h, c = -2 * u3 + 3 * u2, d = (u3 - u2) * h;
  for (let k = 0; k < dim; k++) out[k] = a * V[i0 + k] + b * D[i0 + k] + c * V[i1 + k] + d * D[i1 + k];
  return j;
}
const smoothstep = (x) => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const lerp = (a, b, t) => a + (b - a) * t;
const D2R = Math.PI / 180;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

start($(".c3d")).catch((e) => { console.warn("[lab]", e); $("#hudPhase").textContent = "Couldn't load: " + e.message; });

async function start(box) {
  const [THREE, data] = await Promise.all([
    import(CFG.three),
    fetch(box.dataset.src).then(async (r) => { if (!r.ok) throw new Error("c_web.bin: HTTP " + r.status);
      if (!/\.txt$/.test(box.dataset.src)) return r.arrayBuffer();
      const b = atob((await r.text()).trim()), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a.buffer; }),
  ]);
  const C = parse(data);
  const track = box.closest(".c3d-track");
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setClearColor(CFG.background, 1);
  const canvas = renderer.domElement;
  canvas.style.cssText = "position:absolute;inset:0;width:100%;height:100%;display:block";
  box.prepend(canvas);
  const scene = new THREE.Scene();
  const BG = new THREE.Color(CFG.background);
  scene.fog = new THREE.Fog(CFG.background, 1e8, 1e9);

  const base = new URL(box.dataset.src, location.href);
  const loader = new THREE.TextureLoader();
  const tex = (name) => new Promise((ok, no) => loader.load(new URL(name, base).href, (t) => { t.colorSpace = THREE.SRGBColorSpace; t.generateMipmaps = false; t.minFilter = THREE.LinearFilter; ok(t); }, undefined, no));
  const [blockTex, tubeTex] = await Promise.all([tex(CFG.look.block), tex(CFG.look.tube)]);

  // ---- the square's own frame (as on the live pages)
  const blk = C.parts.find((p) => p.mat === 0) || C.parts[0];
  const nAx = new THREE.Vector3(C.sym[0], C.sym[1], C.sym[2]).normalize();
  let uAx = null, best = 0;
  for (let k = 0; k < blk.nor.length; k += 3) {
    const v = new THREE.Vector3(blk.nor[k], blk.nor[k + 1], blk.nor[k + 2]);
    if (Math.abs(v.dot(nAx)) > 0.1) continue;
    v.addScaledVector(nAx, -v.dot(nAx)).normalize();
    let votes = 0;
    for (let j = 0; j < blk.nor.length; j += 3) { const w = new THREE.Vector3(blk.nor[j], blk.nor[j + 1], blk.nor[j + 2]); if (Math.abs(w.dot(nAx)) < 0.1 && Math.abs(Math.abs(w.dot(v)) - 1) < 0.02) votes++; }
    if (votes > best) { best = votes; uAx = v; }
  }
  if (!uAx) uAx = new THREE.Vector3(1, 0, 0).cross(nAx).normalize();
  const vAx = new THREE.Vector3().crossVectors(nAx, uAx).normalize();
  let half = 0, thick = 0;
  for (let k = 0; k < blk.pos.length; k += 3) { const p = new THREE.Vector3(blk.pos[k], blk.pos[k + 1], blk.pos[k + 2]); half = Math.max(half, Math.abs(p.dot(uAx)), Math.abs(p.dot(vAx))); thick = Math.max(thick, Math.abs(p.dot(nAx))); }
  const tub = C.parts.find((p) => p.mat === 1);
  let rTube = 0.1 * half, inner = half, outer = half;
  if (tub) {
    let ax = 0, dg = 0; outer = 0;

        // they move (scrolling back up, the blocks lift), it's gone at once instead of stretching into a slanted rod
        if (persp) { pp *= 1 - smoothstep(Math.abs(len - (pitch - 2 * cS)) / (0.06 * pitch)); if (pp < 0.003) continue; }
        mid.addVectors(pA, pB).multiplyScalar(0.5);

        sC.set(conRad, len, conRad);

    // the ends of the wall fade out (so its blocks gliding round the ends never show), until the wall goes on
    const xa = xF + c0 * pitch, xb = xF + c1 * pitch;
    const maskOn = w * smoothstep((fs - form + 10) / 10) * (1 - fieldOn);
    U.uMask.value.set(xa - 0.45 * pitch, xb + 0.45 * pitch, 0.5 * pitch, persp ? maskOn : 0);
    U.uNet.value.x = xLat;
    U.uNetA.value.x = t;
    U.uNetB.value.set(NT.rest, NT.restBrightness, still ? 0 : hand * gridOK, CFG.tubes.flicker);
    const az = 2.3, el = 0.35;
    U.uKeyDir.value.set(Math.cos(az) * Math.cos(el), Math.sin(el), Math.sin(az) * Math.cos(el)).normalize();
    U.uKey.value.set(P.key * k, P.sheen * k * 0.9, 70, 0);
    U.uSpill2.value.set(P.spill * k, P.ao * k, k * hand * gridOK, 0);

    hudPhase.textContent = w < 0.02 ? "C" : fs < form ? "C → line → grid" : zp > 0.02 ? "Grid wall, pulled back" : "Grid wall";
    hudCam.textContent = camera.fov < 1 ? "orthographic (top)" : `lens ${camera.fov.toFixed(0)}° · tilt ${cam.tilt.toFixed(0)}° · turn ${cam.yaw.toFixed(0)}°`;
    const dofA = P.dof * k;
    floor.visible = dofA > 0.01 && fs >= settled - 0.5;
    floor.position.set(tx, restY - blockBottom * 1.05, tz);
    if (dofA > 0.01) {
      bgFor(true);
      DOF.uAmt.value = dofA; DOF.uFocus.value = D; DOF.uNF.value.set(camera.near, camera.far);
      renderer.setRenderTarget(rt); renderer.render(scene, camera);
      renderer.setRenderTarget(cocRT); renderer.render(cocScene, postCam);

    } else { bgFor(false); renderer.render(scene, camera); }
  }
  let manual = false;
  box.__lab = { stepTo: (s1, n = 10) => { manual = true; const s0 = sNow; for (let k = 1; k <= n; k++) { sNow = s0 + (s1 - s0) * k / n; clock += 1 / 30; draw(1 / 30); } }, dbg: () => ({ fieldOn, reveal, chase, ...dbgNow }), set: (s, tt) => { sNow = s; if (tt !== undefined) clock = tt; snapNext = 3; }, P, applyPreset, draw };

  function loop(now) {
    if (manual) return;
    const dt = last ? Math.min(0.1, (now - last) / 1000) : 0.016;
    last = now;
    if (!still) clock += dt;
    const d = snapNext ? 0 : progress() - sNow;

  }

    rt.setSize(bs.x, bs.y); cocRT.setSize(bs.x, bs.y); DOF.uRes.value.copy(bs); DOF.uMax.value = 12 * renderer.getPixelRatio(); DOF.uPR.value = renderer.getPixelRatio();
    planCamera();
  }

  resize();
  new IntersectionObserver((es) => { last = 0; renderer.setAnimationLoop(es[es.length - 1].isIntersecting ? loop : null); }).observe(box);
}
